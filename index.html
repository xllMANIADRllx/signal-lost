<!-- Boot splash — ASCII decrypt reveal. Updates run silently in background. -->
<style>
#updateSplash{
  display:flex;position:fixed;top:0;left:0;width:100%;height:100%;
  background:#000000;z-index:99999;
  flex-direction:column;justify-content:center;align-items:center;
  font-family:'Courier New',monospace;
  transition:opacity 0.55s ease;
}
#updateSplash.fade-out{opacity:0;pointer-events:none;}
.uTitle{
  color:#00ff66;font-size:34px;font-weight:bold;letter-spacing:10px;
  text-shadow:0 0 12px rgba(0,255,102,0.35);
  display:flex;gap:2px;margin-bottom:14px;
}
.uChar{display:inline-block;min-width:0.62em;text-align:center;color:#1a4422;transition:color 0.15s,text-shadow 0.15s;}
.uChar.locked{color:#00ff66;text-shadow:0 0 8px rgba(0,255,102,0.55);}
#uVersion{
  color:#336644;font-size:13px;letter-spacing:4px;margin-bottom:6px;
  opacity:0;transition:opacity 0.5s ease 0.05s;
}
.uSub{
  color:#224433;font-size:11px;letter-spacing:3px;
  opacity:0;transition:opacity 0.5s ease 0.15s;
}
</style>

<div id="updateSplash">
  <div class="uTitle" id="uTitle"></div>
  <div id="uVersion">v...</div>
  <div class="uSub">ROGUE AI CONTAINMENT PROTOCOL</div>
</div>

<script>
(function(){
  const splash    = document.getElementById('updateSplash');
  const titleEl   = document.getElementById('uTitle');
  const versionEl = document.getElementById('uVersion');
  const subEl     = document.querySelector('.uSub');

  function dismiss(){
    splash.classList.add('fade-out');
    setTimeout(()=>{ splash.style.display='none'; }, 600);
  }

  // ─── ASCII decrypt animation ────────────────────────
  const TITLE = 'SIGNAL_LOST.EXE';
  const NOISE = '█▓▒░│┤├┴┼·#@%&?!*=◆◊◌◐◑▌▐';
  const STANDBY_MS    = 2000;  // black-screen standby so fullscreen can settle
  const LOCK_START_MS = 220;   // first char locks at this time (post-standby)
  const LOCK_STEP_MS  = 110;   // delay between sequential lockups
  const REVEAL_HOLD_MS = 900;  // hold fully-resolved screen before fade

  // Pre-fill the title with noise so the screen isn't bare during standby
  const charStates = [];
  for(let i=0;i<TITLE.length;i++){
    const span = document.createElement('span');
    span.className = 'uChar';
    span.textContent = NOISE[Math.floor(Math.random()*NOISE.length)];
    titleEl.appendChild(span);
    charStates.push({el:span, target:TITLE[i], locked:false});
  }
  // Hide the title during standby for a true blackout, then reveal at standby end
  titleEl.style.opacity = '0';
  titleEl.style.transition = 'opacity 0.25s ease';

  setTimeout(()=>{
    titleEl.style.opacity = '1';

    // Shuffle noise on unlocked chars
    const shuffleIv = setInterval(()=>{
      let anyUnlocked = false;
      for(const c of charStates){
        if(!c.locked){
          c.el.textContent = NOISE[Math.floor(Math.random()*NOISE.length)];
          anyUnlocked = true;
        }
      }
      if(!anyUnlocked) clearInterval(shuffleIv);
    }, 55);

    // Lock chars left-to-right
    charStates.forEach((c, i)=>{
      setTimeout(()=>{
        c.locked = true;
        c.el.textContent = c.target;
        c.el.classList.add('locked');
      }, LOCK_START_MS + i * LOCK_STEP_MS);
    });

    // Reveal version + subtitle once title is fully locked
    const titleDoneMs = LOCK_START_MS + TITLE.length * LOCK_STEP_MS;
    setTimeout(()=>{
      versionEl.style.opacity = '1';
      subEl.style.opacity = '1';
    }, titleDoneMs);

    // Dismiss after the reveal hold
    setTimeout(dismiss, titleDoneMs + REVEAL_HOLD_MS);
  }, STANDBY_MS);

  // ─── Background update handling (silent) ────────────
  // Updates still install on quit via Electron autoUpdater. The splash is
  // not used to surface progress anymore — status is exposed on window
  // for the menu to consume (e.g. a future "UPDATE READY" toast).
  window._updateStatus = null;

  if(window.electronAPI){
    window.electronAPI.onAppVersion((version)=>{
      window._appVersion = version;
      versionEl.textContent = 'v' + version;
    });
    window.electronAPI.onUpdateStatus((message)=>{
      window._updateStatus = message;
    });
  }
})();
</script>
