<!-- Update splash screen — driven by Electron autoUpdater -->
<style>
#updateSplash{
  display:flex;position:fixed;top:0;left:0;width:100%;height:100%;
  background:#000000;z-index:99999;
  flex-direction:column;justify-content:center;align-items:center;
  font-family:'Courier New',monospace;
  transition:opacity 0.6s ease;
}
#updateSplash.fade-out{opacity:0;pointer-events:none;}
.uTitle{color:#00ff66;font-size:28px;font-weight:bold;letter-spacing:6px;margin-bottom:8px;}
.uSub{color:#224433;font-size:11px;letter-spacing:2px;margin-bottom:32px;}
.uStatus{font-size:13px;min-height:20px;margin-bottom:16px;transition:color 0.3s;}
.uBarTrack{width:420px;height:3px;background:#001a00;position:relative;overflow:hidden;}
.uBarFill{height:100%;width:0%;transition:width 0.3s ease;position:absolute;top:0;left:0;}
.uBarFill.pulse{animation:barPulse 0.8s ease-in-out infinite;}
@keyframes barPulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
.uCountdown{color:#ffdd00;font-size:12px;margin-top:12px;min-height:18px;}
.uPid{color:#1a3322;font-size:10px;margin-top:24px;letter-spacing:1px;}
</style>

<div id="updateSplash">
  <div class="uTitle">SIGNAL_LOST.EXE</div>
  <div id="uVersion" style="color:#336644;font-size:13px;letter-spacing:3px;margin-bottom:4px;">v...</div>
  <div class="uSub">ROGUE AI CONTAINMENT PROTOCOL</div>
  <div id="uStatus" class="uStatus" style="color:#00cc66;">&gt; INITIALISING...</div>
  <div class="uBarTrack"><div id="uBar" class="uBarFill" style="background:#00cc66;"></div></div>
  <div id="uCountdown" class="uCountdown"></div>
  <div class="uPid" id="uPid"></div>
</div>

<script>
(function(){
  const splash   = document.getElementById('updateSplash');
  const uStatus  = document.getElementById('uStatus');
  const uBar     = document.getElementById('uBar');
  const uCountdown = document.getElementById('uCountdown');
  const uPid     = document.getElementById('uPid');

  // Random PID for flavour
  uPid.textContent = 'PID: 0x' + Math.floor(Math.random()*0xFFFF).toString(16).toUpperCase().padStart(4,'0') + '  ·  ELECTRON v35  ·  WIN32 x64';

  function setBar(pct, col, pulse){
    uBar.style.width = pct + '%';
    uBar.style.background = col || '#00cc66';
    uBar.classList.toggle('pulse', !!pulse);
  }

  function dismiss(){
    splash.classList.add('fade-out');
    setTimeout(()=>{ splash.style.display='none'; }, 650);
  }

  // Idle loop — animate bar slowly while waiting
  let idlePct=0;
  const idleIv=setInterval(()=>{
    idlePct=Math.min(idlePct+Math.random()*6,72);
    setBar(idlePct,'#00cc66',false);
    uStatus.textContent='> CHECKING FOR UPDATES...';
    uStatus.style.color='#00cc66';
    if(idlePct>=72)clearInterval(idleIv);
  },150);

  let countdownIv=null;

  function handleMessage(message){
    if(message===null){
      // null = up to date or error — dismiss
      clearInterval(idleIv);
      clearInterval(countdownIv);
      setBar(100,'#00cc66',false);
      uStatus.textContent='> UP TO DATE ✓';
      uStatus.style.color='#00ff66';
      uCountdown.textContent='';
      setTimeout(dismiss, 800);
      return;
    }

    if(message==='CHECKING FOR UPDATES...'){
      uStatus.textContent='> CHECKING FOR UPDATES...';
      uStatus.style.color='#00cc66';
      setBar(idlePct,'#00cc66',false);

    } else if(message==='UPDATE FOUND — DOWNLOADING...'){
      clearInterval(idleIv);
      uStatus.textContent='> UPDATE FOUND — DOWNLOADING...';
      uStatus.style.color='#ffaa00';
      setBar(85,'#ffaa00',true);
      uCountdown.textContent='';

    } else if(message.startsWith('DOWNLOADING UPDATE —')){
      // Parse "DOWNLOADING UPDATE — XX%"
      const match=message.match(/(\d+)%/);
      const pct=match?parseInt(match[1]):0;
      clearInterval(idleIv);
      uStatus.textContent='> '+message;
      uStatus.style.color='#ffaa00';
      setBar(pct,'#ffaa00',false);
      uCountdown.textContent=pct+'% complete';

    } else if(message==='UPDATE READY — INSTALLING ON CLOSE'){
      clearInterval(idleIv);
      setBar(100,'#ffdd00',false);
      uStatus.textContent='> UPDATE READY — INSTALLING ON CLOSE';
      uStatus.style.color='#ffdd00';
      // 3 second countdown
      let secs=3;
      uCountdown.textContent='> RESTARTING IN '+secs+'...';
      countdownIv=setInterval(()=>{
        secs--;
        if(secs<=0){
          clearInterval(countdownIv);
          uCountdown.textContent='> RESTARTING NOW...';
        } else {
          uCountdown.textContent='> RESTARTING IN '+secs+'...';
        }
      },1000);

    } else {
      // Any other message — show it
      clearInterval(idleIv);
      uStatus.textContent='> '+message;
      uStatus.style.color='#00cc66';
    }
  }

  if(window.electronAPI){
    // Receive version from main process
    window.electronAPI.onAppVersion((version)=>{
      window._appVersion=version;
      document.getElementById('uVersion').textContent='v'+version;
    });
    window.electronAPI.onUpdateStatus(handleMessage);
    // Safety dismiss after 8s if no messages
    setTimeout(()=>{
      if(splash.style.display!=='none'&&!splash.classList.contains('fade-out')){
        clearInterval(idleIv);dismiss();
      }
    },8000);
  } else {
    // Browser — no Electron, dismiss quickly
    uStatus.textContent='> STANDALONE MODE';
    uStatus.style.color='#336644';
    setBar(100,'#336644',false);
    setTimeout(dismiss,1000);
  }
})();
</script>
