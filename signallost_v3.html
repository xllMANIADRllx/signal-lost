      this.time.delayedCall(200,()=>{this.scene.stop();this.scene.resume('GameScene',{upgrade:null});});
    });
    this.input.keyboard.once('keydown-ESC',()=>sk.emit('pointerdown'));
    this.input.keyboard.once('keydown-S',()=>sk.emit('pointerdown'));

    // ── Upgrade definitions ──
    const UPGRADES={
      bubble_size:    {name:'RADIUS_EXPAND',   icon:'○',color:'#00aaff',desc:'Warp field max radius +15px per tier. Catches more bullets simultaneously.'},
      bubble_speed:   {name:'EXPANSION_RATE',  icon:'⟳',color:'#00ff88',desc:'Bubble expansion speed +70px/s. Deploy your warp field faster.'},
      reflect_speed:  {name:'REFLECT_BOOST',   icon:'↯',color:'#ff00ff',desc:'Reflected bullet velocity +50% per tier. Faster bullets deal more chain damage.'},
      shield:         {name:'SHIELD_LAYER',    icon:'◈',color:'#ffdd00',desc:'Generates a hex shield absorbing one hit. Stack for multiple charges.'},
      magnet:         {name:'SIGNAL_PULL',     icon:'⊕',color:'#00ffff',desc:'Enemy bullets are drawn toward your bubble edge. Easier to catch stray shots.'},
      multishot:      {name:'ECHO_BURST',      icon:'✦',color:'#ff6688',desc:'Each reflection spawns 2 extra vectors at ±21°. Triple your reflected output.'},
      slow:           {name:'DECAY_FIELD',     icon:'≋',color:'#aa00ff',desc:'All enemy speeds reduced 25% per tier. Buys crucial reaction time in dense waves.'},
      score_boost:    {name:'DATA_HARVEST',    icon:'▲',color:'#ffaa00',desc:'Score multiplier +0.5x per tier. Every kill scales exponentially.'},
      signal_fork:    {name:'SIGNAL_FORK',     icon:'⋔',color:'#00ffcc',desc:'Ping emits 2 hex rings instead of 1. Second ring fires 0.35s after the first.'},
      packet_cache:   {name:'PACKET_CACHE',    icon:'▣',color:'#66cc88',desc:'5 kills within 3s grants 3 seconds of free reflect — no heat buildup.'},
      null_shield:    {name:'NULL_SHIELD',     icon:'◯',color:'#aaffdd',desc:'Shield regenerates automatically every 25 seconds if broken.'},
      echo_protocol:  {name:'ECHO_PROTOCOL',   icon:'↩',color:'#ff88ff',desc:'Reflected bullets bounce once off screen edges for a second pass.'},
      corrupt_data:   {name:'CORRUPT_DATA',    icon:'⚡',color:'#ff4444',desc:'Enemy defection threshold drops from 3 hits to 2. Corrupt enemies faster.'},
      ghost_trace:    {name:'GHOST_TRACE',     icon:'~', color:'#aaaaff',desc:'Your movement trail deals 1 damage/sec to enemies that walk through it.'},
      overclock_burst:{name:'OVERCLOCK_BURST', icon:'⚙',color:'#ff8800',desc:'First reflection after bubble deploys is critical — 2x speed and 2x damage.'},
      signal_decay:   {name:'SIGNAL_DECAY',    icon:'↓',color:'#884400',desc:'Enemies slow 2% per second they are alive on screen. Max -30% over time.'},
      firewall_breach:{name:'FIREWALL_BREACH', icon:'⊞',color:'#ff2244',desc:'Memory sector locked cells fully block enemy movement, not just slow them.'},
      chain_amplifier:{name:'CHAIN_AMPLIFIER', icon:'∞',color:'#ffdd44',desc:'Chain reaction depth +1 per tier. Default 5, max 8. Bigger cascades.'},
    };

    // Build picks
    const picks=[];
    const shuffled=[...Object.entries(UPGRADES)].sort(()=>Math.random()-0.5);
    for(const [id,u] of shuffled){
      if(picks.length>=(data.extraCard?4:3))break;
      const curLevel=(data.upgrades||{})[id]||0;
      if(curLevel>=4)continue; // skip maxed upgrades (T4 = max)
      picks.push({id,...u,level:curLevel});
    }

    // ── Cards — right side of screen ──
    const RX=LP+10; // right area start x
    const RW=W-RX-10; // right area width
    const CW=Math.floor((RW-(picks.length-1)*12)/picks.length);
    const CH=H-56-10; // card height
    const cardTopY=58;
    const MAX_TIER=4;

    picks.forEach((upg,i)=>{
      const cx=RX+i*(CW+12)+CW/2;
      const cy=cardTopY+CH/2;
      const col=parseInt(upg.color.replace('#',''),16);
      const isNew=upg.level===0;

      // Card
      const card=this.add.rectangle(cx,cy,CW,CH,0x000000,0.97)
        .setStrokeStyle(isNew?2:1,col,isNew?0.8:0.5).setInteractive({useHandCursor:true});
      this.add.rectangle(cx-CW/2,cardTopY,CW,5,col,0.9).setOrigin(0,0);
      this.add.rectangle(cx-CW/2,cardTopY,3,CH,col,0.5).setOrigin(0,0);

      // NEW badge
      if(isNew){
        this.add.rectangle(cx+CW/2-36,cardTopY+8,62,18,col,0.2).setOrigin(0.5,0);
        this.add.text(cx+CW/2-36,cardTopY+8,'NEW',{fontFamily:"'Courier New',monospace",fontSize:'9px',color:upg.color}).setOrigin(0.5,0);
      } else {
        this.add.text(cx+CW/2-36,cardTopY+8,`T${upg.level}→T${upg.level+1}`,{fontFamily:"'Courier New',monospace",fontSize:'9px',color:upg.color}).setOrigin(0.5,0);
      }

      // Icon
      const iconY=cardTopY+60;
      const ig=this.add.graphics();
      ig.fillStyle(col,0.14);ig.fillCircle(cx,iconY,34);
      ig.lineStyle(1.5,col,0.6);ig.strokeCircle(cx,iconY,34);
      this.add.text(cx,iconY,upg.icon,{fontFamily:"'Courier New',monospace",fontSize:'28px',color:upg.color}).setOrigin(0.5,0.5);

      // Name
      this.add.text(cx,iconY+50,upg.name,{fontFamily:"'Courier New',monospace",fontSize:'13px',fontStyle:'bold',color:upg.color,align:'center',wordWrap:{width:CW-20}}).setOrigin(0.5,0);

      // Divider
      this.add.rectangle(cx,iconY+82,CW-24,1,col,0.25).setOrigin(0.5,0);

      // Description
      this.add.text(cx-CW/2+12,iconY+90,upg.desc,{fontFamily:"'Courier New',monospace",fontSize:'11px',color:'#44aa66',wordWrap:{width:CW-24},lineSpacing:3});

      // Tier pip bar
      const pipY=cy+CH/2-72;
      this.add.text(cx-CW/2+12,pipY,isNew?'FIRST INSTALL':`T${upg.level} → T${upg.level+1}`,{fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#336644'});
      for(let t=0;t<MAX_TIER;t++){
        const filled=t<upg.level,isNext=t===upg.level;
        const px=cx-CW/2+12+t*(CW-24)/MAX_TIER;
        const pw=(CW-24)/MAX_TIER-4;
        this.add.rectangle(px,pipY+14,pw,7,filled?col:isNext?col:0x0a1a0d,filled?0.7:isNext?0.25:0.8).setOrigin(0,0);
        if(filled||isNext)this.add.rectangle(px,pipY+14,pw,7).setStrokeStyle(0.5,col,filled?0.5:0.4).setOrigin(0,0);
      }

      // Install button
      const btnY=cy+CH/2-36;
      const btnBg=this.add.rectangle(cx,btnY,CW-16,32,0x001500,0.95).setOrigin(0.5).setStrokeStyle(1.5,col,0.8);
      const btnTxt=this.add.text(cx,btnY,'[ INSTALL ]',{fontFamily:"'Courier New',monospace",fontSize:'13px',fontStyle:'bold',color:upg.color}).setOrigin(0.5);

      card.on('pointerover',()=>{card.setFillStyle(col,0.10);card.setStrokeStyle(2.5,col,0.95);btnBg.setFillStyle(col,0.2);btnTxt.setColor('#ffffff');});
      card.on('pointerout', ()=>{card.setFillStyle(0x000000,0.97);card.setStrokeStyle(isNew?2:1,col,isNew?0.8:0.5);btnBg.setFillStyle(0x001500,0.95);btnTxt.setColor(upg.color);});
      card.on('pointerdown',()=>{
        picks.forEach(p=>p._cardObj&&p._cardObj.removeInteractive());
        this._vfxUpgradeSelect(cx,cy,col,upg,picks,i,()=>{
          try{CRT.inGame=true;}catch(e){}
          this.scene.stop();
          this.scene.resume('GameScene',{upgrade:upg.id,overclocked:data.overclocked});
        });
      });
      upg._cardObj=card;
    });
  }

  _vfxUpgradeSelect(cx,cy,col,upg,picks,chosenIdx,onDone){
    try{
      const g=this.add.graphics().setDepth(30);
      const frags=[];
      for(let i=0;i<18;i++){
        const a=(Math.PI*2/18)*i,spd=4+Math.random()*5;
        frags.push({x:cx,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,r:4+Math.random()*6,rot:Math.random()*Math.PI});
      }
      picks.forEach((p,pi)=>{
        if(pi===chosenIdx)return;
        if(p._borderObj)this.tweens.add({targets:p._borderObj,alpha:0,duration:280});
        if(p._cardObj){
          const wipe=this.add.rectangle(p._cardX||0,(p._cardY||0)-H/2+46,280,0,0x000000,0.95).setOrigin(0.5,0).setDepth(25);
          this.tweens.add({targets:wipe,height:H-90,duration:320,ease:'Power2'});
        }
      });
      const beam=this.add.rectangle(cx,cy,3,0,col,0.8).setOrigin(0.5,0).setDepth(28);
      this.tweens.add({targets:beam,height:H-cy,duration:220,ease:'Power2'});
      const iv=this.time.addEvent({delay:16,repeat:45,callback:()=>{
        g.clear();
        frags.forEach(f=>{
          f.x+=f.vx;f.y+=f.vy;f.vy+=0.12;f.life-=0.022;f.rot+=0.1;
          if(f.life<=0)return;
          g.fillStyle(col,f.life*0.9);
          g.beginPath();
          for(let s=0;s<6;s++){const a=f.rot+(Math.PI/3)*s;if(s===0)g.moveTo(f.x+Math.cos(a)*f.r,f.y+Math.sin(a)*f.r);else g.lineTo(f.x+Math.cos(a)*f.r,f.y+Math.sin(a)*f.r);}
          g.closePath();g.fillPath();
        });
      }});
      const logT=this.add.text(W/2,H-50,`> MODULE [${upg.name}] INJECTED — PROCESS MODIFIED`,{
        fontFamily:"'Courier New',monospace",fontSize:'12px',fontStyle:'bold',
        color:'#'+col.toString(16).padStart(6,'0')
      }).setOrigin(0.5).setAlpha(0).setDepth(35);
      this.tweens.add({targets:logT,alpha:1,duration:160});
      const fl=this.add.rectangle(W/2,H/2,W,H,col,0).setDepth(32);
      this.tweens.add({targets:fl,alpha:0.1,duration:100,yoyo:true,onComplete:()=>fl.destroy()});
      this.time.delayedCall(460,()=>{
        g.destroy();beam.destroy();
        this.cameras.main.fadeOut(200,0,0,0);
        this.time.delayedCall(200,onDone);
      });
    }catch(err){
      this.cameras.main.fadeOut(220,0,0,0);
      this.time.delayedCall(220,onDone);
    }
  }
}

// GAME OVER SCENE
// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════
// RUN SUMMARY SCENE
// ═══════════════════════════════════════════════════════════
class RunSummaryScene extends Phaser.Scene{
  constructor(){super('RunSummaryScene');}

  create(d){
    try{CRT.inGame=false;}catch(e){}
    this.cameras.main.setBackgroundColor('#000000');
    this.cameras.main.fadeIn(400,0,0,0);
    const D=d||{};
    const score=D.score||0;
    const wave=D.wave||0;
    const kills=D.kills||0;
    const shards=D.shards||0;
    const chain=D.bestChain||0;
    const stage=D.stage||0;
    const deathCause=D.deathCause||'UNKNOWN_ERROR';
    const timeAlive=D.timeAlive||0;
    const upgrades=D.upgrades||{};
    const mode=(D.mode||'normal').toUpperCase();
    const archetype=(D.archetype||'').toUpperCase();
    const rollbackUsed=D.rollbackUsed||false;
    const reflected=D.reflected||0;

    const STAGE_NAMES=['SURFACE_LAYER','KERNEL_SPACE','DEEP_MEMORY','SECTOR_00'];
    const STAGE_COLS=[0x00cc66,0xff6600,0xaa44ff,0xffd700];
    const STAGE_STRS=['#00cc66','#ff6600','#aa44ff','#ffd700'];
    const accentNum=STAGE_COLS[stage]||0x00cc66;
    const accentStr=STAGE_STRS[stage]||'#00cc66';
    const sectorName=STAGE_NAMES[stage]||'SURFACE_LAYER';

    const isNewBest=score>(Save.hs()||0);
    if(isNewBest)Save.saveHs(score);

    const prevBest=isNewBest?score:(Save.hs()||0);
    const fmt=s=>{const m=Math.floor(s/60),sec=Math.floor(s%60);return`${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;};

    // ── Background ──
    const bg=this.add.graphics();
    bg.lineStyle(1,accentNum,0.07);
    bg.beginPath();
    for(let x=0;x<=W;x+=80){bg.moveTo(x,0);bg.lineTo(x,H);}
    for(let y=0;y<=H;y+=80){bg.moveTo(0,y);bg.lineTo(W,y);}
    bg.strokePath();

    // ── Death header banner ──
    this.add.rectangle(W/2,0,W,72,0x0d0000,0.97).setOrigin(0.5,0);
    this.add.rectangle(W/2,72,W,2,0xff2244,0.7).setOrigin(0.5,0);
    this.add.text(W/2,18,'// PROCESS_TERMINATED — EXIT_CODE: 0xDEAD',{
      fontFamily:"'Courier New',monospace",fontSize:'11px',color:'#cc4444',letterSpacing:2
    }).setOrigin(0.5);
    const deathTxt=this.add.text(W/2,46,`SIGNAL LOST — ${deathCause}`,{
      fontFamily:"'Courier New',monospace",fontSize:'20px',fontStyle:'bold',color:'#ff2244',letterSpacing:2
    }).setOrigin(0.5).setAlpha(0);
    this.tweens.add({targets:deathTxt,alpha:1,duration:300,delay:100});
    // Glitch pulse on death text
    this.time.addEvent({delay:2200,repeat:-1,callback:()=>{
      deathTxt.setColor('#ffffff');
      this.time.delayedCall(60,()=>deathTxt.setColor('#ff2244'));
      this.time.delayedCall(120,()=>deathTxt.setColor('#ffffff'));
      this.time.delayedCall(180,()=>deathTxt.setColor('#ff2244'));
    }});

    // ── Stat cards 3×2 grid ──
    const CW=280, CH=74, GAPX=16, GAPY=12;
    const GRID_Y=86;
    const totalGridW=3*CW+2*GAPX;
    const gridX=(W-totalGridW)/2;

    const STATS=[
      {label:'SIGNAL_SCORE', value:score.toLocaleString(), col:'#00ffcc', colN:0x00ffcc,
       badge:isNewBest?'NEW BEST ▲':score>0?`BEST: ${prevBest.toLocaleString()}`:''},
      {label:'WAVE_REACHED',  value:String(wave),           col:'#00ff88', colN:0x00ff88, badge:''},
      {label:'ENEMIES_TERMINATED', value:kills.toLocaleString(), col:'#ffdd00', colN:0xffdd00, badge:''},
      {label:'BULLETS_REFLECTED',  value:reflected.toLocaleString(), col:'#4488ff', colN:0x4488ff, badge:''},
      {label:'BEST_COMBO',   value:`×${chain}`,             col:'#ff9944', colN:0xff9944, badge:''},
      {label:'SHARDS_EARNED', value:`+${shards} ◆`,         col:'#aaffdd', colN:0xaaffdd, badge:''},
    ];

    STATS.forEach((s,i)=>{
      const col=i%3,row=Math.floor(i/3);
      const cx=gridX+col*(CW+GAPX);
      const cy=GRID_Y+row*(CH+GAPY);

      const card=this.add.rectangle(cx,cy,CW,CH,0x020a04,0.97).setOrigin(0,0).setAlpha(0);
      card.setStrokeStyle(1,s.colN,0.35);
      this.add.rectangle(cx,cy,CW,3,s.colN,0.8).setOrigin(0,0).setAlpha(0);
      const label=this.add.text(cx+14,cy+12,s.label,{
        fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#336644'
      }).setAlpha(0);
      const val=this.add.text(cx+14,cy+34,s.value,{
        fontFamily:"'Orbitron',sans-serif",fontSize:'22px',fontStyle:'bold',color:s.col
      }).setAlpha(0);
      const badge=s.badge?this.add.text(cx+CW-10,cy+12,s.badge,{
        fontFamily:"'Courier New',monospace",fontSize:'9px',
        color:isNewBest&&i===0?'#ffd700':'#336644'
      }).setOrigin(1,0).setAlpha(0):null;

      const delay=200+i*80;
      this.time.delayedCall(delay,()=>{
        if(!this.scene.isActive('RunSummaryScene'))return;
        [card,label,val].forEach(o=>this.tweens.add({targets:o,alpha:1,duration:180}));
        if(badge)this.tweens.add({targets:badge,alpha:1,duration:180});
        // Highlight top bar on new best
        if(i===0&&isNewBest){
          this.tweens.add({targets:val,alpha:{from:1,to:0.5},duration:700,yoyo:true,repeat:-1,delay:400});
        }
      });
    });

    // ── Info strip (archetype, sector, diff, time) ──
    const STRIP_Y=GRID_Y+2*(CH+GAPY)+12;
    const stripBg=this.add.rectangle(gridX,STRIP_Y,totalGridW,42,0x001a0d,0.97).setOrigin(0,0).setAlpha(0);
    stripBg.setStrokeStyle(1,accentNum,0.3);
    this.time.delayedCall(700,()=>{
      if(!this.scene.isActive('RunSummaryScene'))return;
      this.tweens.add({targets:stripBg,alpha:1,duration:180});
      const infos=[
        {label:'ARCHETYPE', val:archetype||'—',    col:'#00ffcc', x:gridX+20},
        {label:'SECTOR',    val:sectorName,         col:accentStr,  x:gridX+220},
        {label:'DIFFICULTY',val:(D.difficulty||'DAEMON').toUpperCase(), col:'#ffdd00', x:gridX+500},
        {label:'DURATION',  val:fmt(timeAlive),     col:'#667788',  x:gridX+720},
      ];
      infos.forEach(inf=>{
        const lt=this.add.text(inf.x,STRIP_Y+8,inf.label,{fontFamily:"'Courier New',monospace",fontSize:'9px',color:'#336644'}).setAlpha(0);
        const vt=this.add.text(inf.x,STRIP_Y+22,inf.val,{fontFamily:"'Courier New',monospace",fontSize:'13px',fontStyle:'bold',color:inf.col}).setAlpha(0);
        this.tweens.add({targets:[lt,vt],alpha:1,duration:180});
      });
    });

    // ── Sector progress bar ──
    const BAR_Y=STRIP_Y+52;
    this.time.delayedCall(850,()=>{
      if(!this.scene.isActive('RunSummaryScene'))return;
      const barBg=this.add.rectangle(gridX,BAR_Y,totalGridW,20,0x030d06,0.97).setOrigin(0,0).setAlpha(0);
      barBg.setStrokeStyle(1,0x1a3322,0.8);
      this.tweens.add({targets:barBg,alpha:1,duration:150});

      STAGE_NAMES.forEach((sn,si)=>{
        const sx=gridX+si*(totalGridW/4);
        const sw=totalGridW/4;
        if(si<stage){
          const fill=this.add.rectangle(sx,BAR_Y,sw,20,STAGE_COLS[si],0.25).setOrigin(0,0).setAlpha(0);
          this.tweens.add({targets:fill,alpha:1,duration:200,delay:si*60});
        } else if(si===stage){
          const fill=this.add.rectangle(sx,BAR_Y,sw*0.5,20,STAGE_COLS[si],0.15).setOrigin(0,0).setAlpha(0);
          this.tweens.add({targets:fill,alpha:1,duration:200});
          // termination marker
          const mark=this.add.rectangle(sx+sw*0.5,BAR_Y,2,20,0xff2244,0.9).setOrigin(0,0).setAlpha(0);
          this.tweens.add({targets:mark,alpha:1,duration:150,delay:100});
        }
        const stxt=this.add.text(sx+sw/2,BAR_Y+10,si===stage?`◈ ${sn}`:sn,{
          fontFamily:"'Courier New',monospace",fontSize:'9px',
          color:si<stage?STAGE_STRS[si]:si===stage?'#ff4466':'#1a3322'
        }).setOrigin(0.5).setAlpha(0);
        this.tweens.add({targets:stxt,alpha:1,duration:150,delay:si*60});
      });
    });

    // ── Action buttons ──
    const ROLLBACK_COST=80;
    const canRollback=!rollbackUsed&&Save.shards()>=ROLLBACK_COST;
    const BTN_Y=H-46;

    this.time.delayedCall(1000,()=>{
      if(!this.scene.isActive('RunSummaryScene'))return;

      this.add.rectangle(W/2,H,W,80,0x000000,0.95).setOrigin(0.5,1);
      this.add.rectangle(W/2,H-80,W,1,accentNum,0.35).setOrigin(0.5,0);

      const btns=[
        {x:W*0.2,  w:270, label:'[ REINITIALISE ]',     sub:'new run — same mode',
         col:0x00ff44, colS:'#00ff44', bg:0x001500, active:true,
         fn:()=>{
            this.cameras.main.fadeOut(280,0,0,0);
            this.time.delayedCall(280,()=>{
              this.scene.stop('RunSummaryScene');
              let arcData={};
              try{arcData=JSON.parse(Save.get('last_run_archetype')||'{}');}catch{}
              this.scene.start('GameScene',{
                mode:D.mode,
                archetype:arcData.archetype||null,
                archetypeSeeds:arcData.archetypeSeeds||null,
                archetypePower:arcData.archetypePower||null,
              });
            });
          }},
        {x:W*0.5,  w:280, label:'[ ROLLBACK_PROCESS ]',
         sub:canRollback?`Cost: ${ROLLBACK_COST} ◈ — once per run`:'UNAVAILABLE',
         col:0x00ffcc, colS:'#00ffcc', bg:canRollback?0x001a1a:0x050505, active:canRollback,
         fn:()=>{if(!canRollback||!Save.spendShards(ROLLBACK_COST))return;this.cameras.main.fadeOut(300,0,0,0);this.time.delayedCall(300,()=>{this.scene.stop('RunSummaryScene');this.scene.start('GameScene',{mode:D.mode,debugWave:D.wave||1,debugUpgrades:D.upgrades||{},debugScore:D.score||0,rollbackUsed:true});});}},
        {x:W*0.8,  w:270, label:'[ RETURN_TO_TERMINAL ]', sub:'disconnect — main menu',
         col:0xff2244, colS:'#ff2244', bg:0x150000, active:true,
         fn:()=>{this.cameras.main.fadeOut(280,0,0,0);this.time.delayedCall(280,()=>{this.scene.stop('RunSummaryScene');try{this.scene.stop('GameScene');}catch{}const ms=this.scene.get('MenuScene');if(ms&&ms.sys.isSleeping())this.scene.wake('MenuScene');else this.scene.start('MenuScene');});}},
      ];

      btns.forEach(b=>{
        const bg2=this.add.rectangle(b.x,BTN_Y,b.w,46,b.bg,0.97)
          .setStrokeStyle(2,b.col,b.active?0.8:0.2).setAlpha(0);
        if(b.active)bg2.setInteractive({useHandCursor:true});
        const accentBar=this.add.rectangle(b.x-b.w/2,BTN_Y-23,4,46,b.col,b.active?0.8:0.15).setOrigin(0,0).setAlpha(0);
        const lbl=this.add.text(b.x,BTN_Y-10,b.label,{
          fontFamily:"'Courier New',monospace",fontSize:'13px',fontStyle:'bold',
          color:b.active?b.colS:'#333333'
        }).setOrigin(0.5).setAlpha(0);
        const sub=this.add.text(b.x,BTN_Y+10,b.sub,{
          fontFamily:"'Courier New',monospace",fontSize:'10px',
          color:b.active?'#447755':'#333333'
        }).setOrigin(0.5).setAlpha(0);
        this.tweens.add({targets:[bg2,accentBar,lbl,sub],alpha:1,duration:200});
        if(b.active){
          bg2.on('pointerover',()=>{bg2.setFillStyle(b.col,0.18);lbl.setColor('#ffffff');});
          bg2.on('pointerout', ()=>{bg2.setFillStyle(b.bg,0.97);lbl.setColor(b.colS);});
          bg2.on('pointerdown',b.fn);
        }
        if(b.label.includes('REINITIALISE')){
          this.tweens.add({targets:lbl,alpha:{from:1,to:0.5},duration:600,yoyo:true,repeat:-1,delay:800});
        }
      });
    });
  }
}

class GameOverScene extends Phaser.Scene{
  constructor(){super('GameOverScene');}
  _terminateToMenu(){
    try{CRT.suppress=true;document.body.style.cursor='none';}catch{}
    const ov=this.add.rectangle(W/2,H/2,W,H,0x000000,0).setDepth(100);
    ov.setAlpha(0);this.tweens.add({targets:ov,alpha:1,duration:150});
    const lines=[
      {t:80,  txt:'> TERMINATE_PROCESS — SIGNAL LOST', col:'#ff2244'},
      {t:200, txt:'> KILLING ALL CHILD PROCESSES...',   col:'#ff4444'},
      {t:320, txt:'> FLUSHING MEMORY BUFFERS...',       col:'#882222'},
      {t:430, txt:'> WRITING CORE DUMP...',             col:'#661111'},
      {t:530, txt:'> PROCESS TERMINATED — EXIT CODE 0', col:'#ff2244'},
    ];
    lines.forEach((l,i)=>{
      this.time.delayedCall(l.t,()=>{
        try{CRT.glitch&&i===0&&CRT.glitch(0.4);}catch{}
        const txt=this.add.text(W/2,H/2-44+i*22,l.txt,{
          fontFamily:"'Courier New',monospace",fontSize:'13px',color:l.col
        }).setOrigin(0.5).setDepth(101).setAlpha(0);
        this.tweens.add({targets:txt,alpha:1,duration:50});
      });
    });
    this.time.delayedCall(750,()=>{
      try{
        const gs=this.scene.get('GameScene');
        if(gs&&gs.shutdown)gs.shutdown();
        this.scene.setVisible(false,'GameScene');
        const ms=this.scene.get('MenuScene');
        if(ms&&ms.sys.isSleeping()){this.scene.wake('MenuScene');}
        else{this.scene.start('MenuScene');}
        setTimeout(()=>{try{this.scene.stop('GameScene');}catch{}try{this.scene.stop('GameOverScene');}catch{}},250);
      }catch(e){try{this.scene.start('MenuScene');}catch{}}
    });
  }

  create(d){
    try{CRT.inGame=false;}catch(e){}
    this.cameras.main.setBackgroundColor('#000000');
    this.cameras.main.fadeIn(100,0,0,0);
    CRT.glitch(1.0);
    const addr=()=>'0x'+Math.floor(Math.random()*0xFFFFFFFF).toString(16).toUpperCase().padStart(8,'0');
    const hex4=()=>'0x'+Math.floor(Math.random()*0xFFFF).toString(16).toUpperCase().padStart(4,'0');
    const isNew=d&&d.score>parseInt(Save.hs()||0);

    // ── Full-screen dark red bg ──
    this.add.rectangle(W/2,H/2,W,H,0x0a0000,1);

    // Red vignette
    for(let i=0;i<6;i++){
      this.add.rectangle(W/2,H/2,W,H,0xff0000,0).setStrokeStyle(i*12,0xff0000,0.04-i*0.005);
    }

    // ── Background red scanlines ──
    const sg=this.add.graphics().setAlpha(0.06);
    for(let y=0;y<H;y+=4){sg.fillStyle(0xff0000,1);sg.fillRect(0,y,W,1);}

    // ── Top panic strip — slides down ──
    const strip=this.add.rectangle(W/2,-18,W,36,0xff0000,0.85).setOrigin(0.5,0.5);
    this.add.rectangle(W/2,-18,W,36).setStrokeStyle(0,0).setOrigin(0.5,0.5); // placeholder depth
    const stripTxt=this.add.text(W/2,-18,'  KERNEL PANIC — PROCESS TERMINATED — SIGNAL LOST  ',{
      fontFamily:"'Courier New',monospace",fontSize:'14px',fontStyle:'bold',color:'#99bbaa',letterSpacing:3
    }).setOrigin(0.5);
    this.tweens.add({targets:[strip,stripTxt],y:18,duration:220,ease:'Power2.Out'});

    // ── ASCII corruption block (left side) ──
    const skull=[
      '  ██████████  ',
      ' ██  ████  ██ ',
      '████  ██  ████',
      '██  ██████  ██',
      ' ██  ████  ██ ',
      '  ██████████  ',
      '   ██    ██   ',
      ' ████████████ ',
    ];
    skull.forEach((row,i)=>{
      this.time.delayedCall(i*30,()=>{
        this.add.text(24,56+i*20,row,{fontFamily:"'Courier New',monospace",fontSize:'13px',color:'#662222'}).setAlpha(0);
        const t2=this.add.text(24,56+i*20,row,{fontFamily:"'Courier New',monospace",fontSize:'13px',color:'#ff0000'}).setAlpha(0);
        this.tweens.add({targets:t2,alpha:0.6,duration:80});
      });
    });

    // ── Crash dump lines ──
    const score=d&&d.score||0,wave=d&&d.wave||0,shards=d&&d.shards||0;
    const chain=d&&d.bestChain||0,mode=(d&&d.mode||'normal').toUpperCase();
    const diff=(Settings.get('difficulty')||'daemon').toUpperCase();

    const lines=[
      {t:0,   txt:`[CRITICAL] PROCESS signal_lost.exe — UNHANDLED EXCEPTION`,  col:'#ff2244',sz:14,bold:true},
      {t:120, txt:`[ FATAL  ] CPU: ${addr()} · PID: ${hex4()} · COMM: signal_lost.exe`, col:'#ff4444',sz:11},
      {t:230, txt:`[ FAULT  ] SIGNAL_STRENGTH: ${score} · WAVE_REACHED: ${wave} · MODE: ${mode} · DIFF: ${diff}`,col:'#ff6644',sz:11},
      {t:330, txt:`[ FAULT  ] SHARDS_HARVESTED: ${shards} ◈ · BEST_CHAIN: ${chain}x`,col:'#ff6644',sz:11},
      {t:420, txt:'',sz:10},
      {t:440, txt:`[ TRACE  ] #0  warp_bubble_collapse+${hex4()} [signal_lost+${addr()}]`,col:'#882222',sz:11},
      {t:510, txt:`[ TRACE  ] #1  packet_integrity_fail+${hex4()} [rogue_core+${addr()}]`,col:'#882222',sz:11},
      {t:580, txt:`[ TRACE  ] #2  rogue_ai_overpowered+${hex4()} [kernel+${addr()}]`,col:'#771111',sz:11},
      {t:650, txt:`[ TRACE  ] #3  process_containment_fail+${hex4()} [network+${addr()}]`,col:'#661111',sz:11},
      {t:720, txt:'',sz:10},
      {t:740, txt:`[ REGS   ] EAX=${addr()} EBX=${addr()} ECX=${addr()} EDX=${addr()}`,col:'#441111',sz:10},
      {t:800, txt:`[ REGS   ] ESI=${addr()} EDI=${addr()} EBP=${addr()} ESP=${addr()}`,col:'#441111',sz:10},
      {t:860, txt:`[ STACK  ] ${addr()}: ff ff 00 de ad be ef 4a 2b 19 c3 00 00 ff ff`,col:'#330000',sz:10},
      {t:920, txt:`[ STACK  ] ${addr()}: 00 00 00 00 00 00 00 00 ff ff ff ff 00 00 00 00`,col:'#330000',sz:10},
      {t:980, txt:'',sz:10},
      {t:1000,txt:`[ DUMP   ] CORE SAVED — /var/crash/signal_lost_${Date.now()}.core`,col:'#ff3333',sz:11},
      ...(isNew?[{t:1080,txt:`[ RECORD ] ★ NEW HIGH SIGNAL: ${score} — PROCESS EXCEEDS LIMITS ★`,col:'#ffd700',sz:14,bold:true}]:[]),
      {t:isNew?1180:1080,txt:'[ SYSTEM ] RECONNECTION AVAILABLE — STANDBY...',col:'#ff4444',sz:12,bold:true},
    ];

    let maxT=0;
    lines.forEach((l,i)=>{
      if(!l.txt)return;
      maxT=Math.max(maxT,l.t);
      this.time.delayedCall(l.t,()=>{
        if(!this.scene.isActive('GameOverScene'))return;
        const y=50+i*22;
        const txt=this.add.text(200,y,l.txt,{
          fontFamily:"'Courier New',monospace",fontSize:`${l.sz}px`,
          fontStyle:l.bold?'bold':'normal',color:l.col
        }).setAlpha(0);
        this.tweens.add({targets:txt,alpha:1,duration:50});
        if(i===0){
          this.tweens.add({targets:txt,x:{from:206,to:196},duration:40,yoyo:true,repeat:3});
          if(Settings.get('shake'))this.cameras.main.flash(250,255,0,0,0.25);
        }
        if(l.bold&&isNew&&l.col==='#ffd700'){
          this.tweens.add({targets:txt,alpha:{from:1,to:0.5},duration:400,yoyo:true,repeat:-1});
        }
      });
    });

    // ── Bottom panel + buttons ──
    this.time.delayedCall(maxT+240,()=>{
      if(!this.scene.isActive('GameOverScene'))return;
      try{
        const debugUses=Save.get('debug_uses')||0;
        const diff2=Settings.get('difficulty')||'daemon';
        const costs=DIFFICULTY[diff2].debugCost;
        const debugCost=debugUses<costs.length?costs[debugUses]:costs[costs.length-1]*2;
        const canDebug=Save.shards()>=debugCost;
        // Rollback vars
        const ROLLBACK_COST=80;
        const canRollback=!d.rollbackUsed&&Save.shards()>=ROLLBACK_COST;
        const fmt2=s=>{const m=Math.floor(s/60),sec=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');};
        const sector=d.stage>=0?['SURFACE_LAYER','KERNEL_SPACE','DEEP_MEMORY','SECTOR_00'][d.stage||0]:'SURFACE_LAYER';
        const sectorCols=['#00cc66','#ff6600','#aa44ff','#ffd700'];
        const sectorCol=sectorCols[d.stage||0]||'#00cc66';

        // Bottom panel
        this.add.rectangle(W/2,H-56,W,108,0x000000,0.97).setOrigin(0.5);
        this.add.rectangle(W/2,H-108,W,2,0x440000,0.9).setOrigin(0.5);

        // Summary strip — richer data
        const timeStr=fmt2(d.timeAlive||0);
        this.add.text(W/2,H-105,`RUNTIME: ${timeStr}  ·  SECTOR: ${sector}  ·  CAUSE: ${d.deathCause||'UNKNOWN'}`,{
          fontFamily:"'Courier New',monospace",fontSize:'10px',color:sectorCol
        }).setOrigin(0.5);
        this.add.text(W/2,H-90,`SIGNAL: ${score}  ·  WAVE: ${wave}  ·  SHARDS: ${shards} ◈  ·  BEST_CHAIN: ${chain}x`,{
          fontFamily:"'Courier New',monospace",fontSize:'11px',color:'#cc4444'
        }).setOrigin(0.5);

        const btnY=H-60;
        const btns=[
          {x:W/2-370,w:210,h:48,label:'[ DEBUG_MODE ]',sub:canDebug?`Cost: ${debugCost} ◈`:'INSUFFICIENT ◈',
           bg:canDebug?0x150800:0x050000,col:0xff8800,colH:'#ff8800',
           active:canDebug,
           fn:()=>{Save.spendShards(debugCost);Save.set('debug_uses',(Save.get('debug_uses')||0)+1);
             this.cameras.main.fadeOut(280,0,0,0);
             this.time.delayedCall(280,()=>this.scene.start('GameScene',{mode:d.mode,debugWave:d.wave,debugUpgrades:d.upgrades,debugScore:d.score}));}},
          {x:W/2-130,w:210,h:48,label:'[ RECONNECT ]',sub:'start new run',
           bg:0x001500,col:0x00ff44,colH:'#00ff44',active:true,
           fn:()=>{Save.set('debug_uses',0);this.cameras.main.fadeOut(280,0,0,0);this.time.delayedCall(280,()=>{
             try{const gs=this.scene.get('GameScene');if(gs)gs.shutdown();}catch{}
             this.scene.stop('GameScene');
             this.scene.stop('GameOverScene');
             let arcData2={};
              try{arcData2=JSON.parse(Save.get('last_run_archetype')||'{}');}catch{}
              this.scene.start('GameScene',{
                mode:d.mode,
                archetype:arcData2.archetype||null,
                archetypeSeeds:arcData2.archetypeSeeds||null,
                archetypePower:arcData2.archetypePower||null,
              });
           });}},
          {x:W/2+110,w:230,h:48,label:'[ ROLLBACK_PROCESS ]',
           sub:canRollback?`Cost: ${ROLLBACK_COST} ◈ — one use per run`:'ALREADY_USED or INSUFFICIENT ◈',
           bg:canRollback?0x001a1a:0x050505,col:0x00ffcc,colH:'#00ffcc',active:canRollback,
           fn:()=>{
             Save.spendShards(ROLLBACK_COST);
             this.cameras.main.fadeOut(300,0,0,0);
             this.time.delayedCall(300,()=>{
               this.scene.stop('GameOverScene');
               // Resume GameScene from same wave/state, rollback flag set
               this.scene.start('GameScene',{
                 mode:d.mode,debugWave:d.wave,debugScore:d.score,
                 debugUpgrades:d.upgrades,rollbackUsed:true,
               });
             });
           }},
          {x:W/2+350,w:210,h:48,label:'[ TERMINATE ]',sub:'kill process — return to shell',
           bg:0x150000,col:0xff2244,colH:'#ff2244',active:true,
           fn:()=>{
             Save.set('debug_uses',0);
             this._terminateToMenu();
           }},
        ];

        btns.forEach(b=>{
          const col=typeof b.col==='string'?parseInt(b.col.replace('#',''),16):b.col;
          const bg2=this.add.rectangle(b.x,btnY,b.w,b.h,b.bg,0.97);
          if(b.active)bg2.setInteractive({useHandCursor:true});
          this.add.rectangle(b.x,btnY,b.w,b.h).setStrokeStyle(b.x===W/2?2:1,col,b.active?0.8:0.25);
          this.add.rectangle(b.x-b.w/2,btnY-b.h/2,2,b.h,col,b.active?0.8:0.2).setOrigin(0,0);
          const lbl=this.add.text(b.x,btnY-9,b.label,{fontFamily:"'Courier New',monospace",fontSize:'14px',fontStyle:'bold',color:b.active?b.colH:(b.col+'88')}).setOrigin(0.5);
          this.add.text(b.x,btnY+12,b.sub,{fontFamily:"'Courier New',monospace",fontSize:'10px',color:b.active?'#224433':'#331111'}).setOrigin(0.5);
          if(b.active){
            bg2.on('pointerover',()=>{bg2.setFillStyle(col,0.15);lbl.setColor('#ffffff');});
            bg2.on('pointerout',()=>{bg2.setFillStyle(b.bg,0.97);lbl.setColor(b.colH);});
            bg2.on('pointerdown',b.fn);
          }
          // Blink the RECONNECT button
          if(b.x===W/2){this.tweens.add({targets:lbl,alpha:0.5,duration:550,yoyo:true,repeat:-1,delay:400});}
        });
      }catch(err){console.error('[GAMEOVER BTN]',err);}
    });

    try{Voice.say('connection lost');}catch{}
  }
}

    this.time.delayedCall(300,()=>{this.tweens.add({targets:[warn,nameT,loreT],alpha:1,duration:380});});

    this.time.delayedCall(3000,()=>{
      this.tweens.add({targets:[rect,topBg,botBg,warn,nameT,loreT],alpha:0,duration:350,onComplete:()=>{this.scene.stop();this.scene.resume('GameScene',{bossReady:true});}});
    });

}

// SETTINGS
// ═══════════════════════════════════════════════════════════
class SettingsScene extends Phaser.Scene{
  constructor(){super('SettingsScene');}
  create(d){
    try{CRT.inGame=false;}catch(e){}
    try{_applyRenderScale();}catch(e){}
    const back=d&&d.from==='pause'?'pause':'menu';
    this.cameras.main.setBackgroundColor('#000000');
    this.cameras.main.fadeIn(280,0,0,0);
    this._catObjs={};
    this._activeCat='render';

    // Grid
    const g=this.add.graphics().setAlpha(0.06);
    g.lineStyle(1,0x00cc66,1);
    for(let x=0;x<=W;x+=80){g.moveTo(x,0);g.lineTo(x,H);}
    for(let y=0;y<=H;y+=80){g.moveTo(0,y);g.lineTo(W,y);}
    g.strokePath();

    // Header
    this.add.rectangle(W/2,0,W,36,0x000000,0.97).setOrigin(0.5,0);
    this.add.rectangle(W/2,36,W,1.5,0x667788,0.5).setOrigin(0.5,0);
    this.add.text(40,17,'// /etc/signal_lost.conf',{fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#4477aa'}).setOrigin(0,0.5);
    this.add.text(W/2,17,'SYS_CONFIG.SH',{fontFamily:"'Orbitron',sans-serif",fontSize:'16px',fontStyle:'900',color:'#667788',letterSpacing:5}).setOrigin(0.5);

    // Divider
    const DIV=220;
    this.add.rectangle(DIV,H/2+18,1,H-36,0x223344,0.5).setOrigin(0.5);

    // ── Left: category nav ──
    this.add.text(14,50,'// CATEGORY',{fontFamily:"'Courier New',monospace",fontSize:'9px',color:'#4477aa'});

    const CATS=[
      {id:'render',  label:'RENDER',   sub:'CRT · Vignette · Shake · Smooth', acol:'#00ff88', acolN:0x00ff88},
      {id:'audio',   label:'AUDIO',    sub:'Music · SFX volumes',           acol:'#4488ff', acolN:0x4488ff},
      {id:'hud',     label:'HUD',      sub:'Scale · Margin',                acol:'#ffdd00', acolN:0xffdd00},
      {id:'display', label:'DISPLAY',  sub:'Canvas scale · Window mode',    acol:'#ff9944', acolN:0xff9944},
    ];

    this._catBtns={};
    CATS.forEach((c,i)=>{
      const y=62+i*62;
      const act=c.id===this._activeCat;
      const cbg=this.add.rectangle(DIV/2,y,DIV-12,50,act?c.acolN:0x000000,act?0.12:0.8).setOrigin(0.5,0).setInteractive({useHandCursor:!act});
      const cbdr=this.add.rectangle(DIV/2,y,DIV-12,50).setStrokeStyle(act?2:1,c.acolN,act?0.85:0.15).setOrigin(0.5,0);
      const cbar=this.add.rectangle(8,y,3,50,c.acolN,act?0.9:0.2).setOrigin(0,0);
      const clbl=this.add.text(20,y+10,c.label,{fontFamily:"'Courier New',monospace",fontSize:'13px',fontStyle:act?'bold':'normal',color:act?c.acol:'#445566'});
      const csub=this.add.text(20,y+28,c.sub,{fontFamily:"'Courier New',monospace",fontSize:'9px',color:act?c.acol:'#334455'});
      this._catBtns[c.id]={bg:cbg,bdr:cbdr,bar:cbar,lbl:clbl,sub:csub,acol:c.acol,acolN:c.acolN};
      cbg.on('pointerover',()=>{if(this._activeCat!==c.id){cbg.setFillStyle(c.acolN,0.08);clbl.setColor('#ffffff');}});
      cbg.on('pointerout', ()=>{if(this._activeCat!==c.id){cbg.setFillStyle(0x000000,0.8);clbl.setColor('#445566');}});
      cbg.on('pointerdown',()=>{if(this._activeCat!==c.id)this._switchCat(c.id);});
    });

    // Version bottom left
    this.add.text(14,H-22,`v${(window._appVersion||'...')}`,{fontFamily:"'Courier New',monospace",fontSize:'9px',color:'#3366aa'}).setOrigin(0,0.5);

    // ── Right: settings panel ──
    this._buildRight('render');

    // Back
    const bkLabel=back==='pause'?'[ RESUME PROCESS ]':'[ BACK TO TERMINAL ]';
    this.add.rectangle(W/2,H-20,W,36,0x000000,0.96).setOrigin(0.5);
    this.add.rectangle(W/2,H-38,W,1,0x223344,0.6).setOrigin(0.5);
    const bk=this.add.text(W/2,H-20,bkLabel,{fontFamily:"'Courier New',monospace",fontSize:'13px',fontStyle:'bold',color:'#445566'}).setOrigin(0.5).setInteractive({useHandCursor:true});
    bk.on('pointerover',()=>bk.setColor('#ffffff'));
    bk.on('pointerout', ()=>bk.setColor('#445566'));
    bk.on('pointerdown',()=>{
      this.cameras.main.fadeOut(240,0,0,0);
      this.time.delayedCall(240,()=>{
        if(back==='pause'){this.scene.stop('SettingsScene');this.scene.resume('GameScene',{fromSettings:true});}
        else{this.scene.stop('SettingsScene');const ms=this.scene.get('MenuScene');if(ms&&ms.sys.isSleeping())this.scene.wake('MenuScene');else this.scene.start('MenuScene');}
      });
    });
  }

  _switchCat(id){
    // Destroy old right panel
    (this._catObjs[this._activeCat]||[]).forEach(o=>{try{o&&o.destroy();}catch{}});
    this._catObjs[this._activeCat]=[];

    // Update left nav visuals
    const prev=this._catBtns[this._activeCat];
    if(prev){
      prev.bg.setFillStyle(0x000000,0.8);
      prev.bdr.setStrokeStyle(1,prev.acolN,0.15);
      prev.bar.setAlpha(0.2);
      prev.lbl.setColor('#445566').setFontStyle('normal');
      prev.sub.setColor('#334455');
      prev.bg.setInteractive({useHandCursor:true});
    }
    this._activeCat=id;
    const cur=this._catBtns[id];
    if(cur){
      cur.bg.setFillStyle(cur.acolN,0.12);
      cur.bdr.setStrokeStyle(2,cur.acolN,0.85);
      cur.bar.setAlpha(0.9);
      cur.lbl.setColor(cur.acol).setFontStyle('bold');
      cur.sub.setColor(cur.acol);
      cur.bg.removeInteractive();
    }
    this._buildRight(id);
  }

  _reg(obj){
    if(!this._catObjs[this._activeCat])this._catObjs[this._activeCat]=[];
    this._catObjs[this._activeCat].push(obj);
    return obj;
  }

  _buildRight(cat){
    if(!this._catObjs[cat])this._catObjs[cat]=[];
    const RP=238, RW=W-RP-16;
    const acol=this._catBtns[cat]?.acol||'#00ff88';
    const acolN=this._catBtns[cat]?.acolN||0x00ff88;
    const RH=58, GAP=8;
    let y=44;

    const row=(label,sub)=>{
      const rowBg=this._reg(this.add.rectangle(RP+RW/2,y,RW,RH,0x040d06,0.97).setOrigin(0.5,0));
      rowBg.setStrokeStyle(1,acolN,0.25);
      this._reg(this.add.rectangle(RP,y,3,RH,acolN,0.6).setOrigin(0,0));
      this._reg(this.add.rectangle(RP,y,RW,3,acolN,0.4).setOrigin(0,0));
      this._reg(this.add.text(RP+14,y+10,label,{fontFamily:"'Courier New',monospace",fontSize:'13px',fontStyle:'bold',color:acol}));
      this._reg(this.add.text(RP+14,y+30,sub,{fontFamily:"'Courier New',monospace",fontSize:'9px',color:'#4477aa'}));
      return rowBg;
    };

    const toggle=(label,sub,key)=>{
      const rowBg=row(label,sub);
      const on=Settings.get(key);
      const trkBg=this._reg(this.add.rectangle(RP+RW-50,y+RH/2,60,24,on?acolN:0x0a1218,on?0.18:0.9).setStrokeStyle(1.5,acolN,on?0.9:0.3));
      const knob=this._reg(this.add.circle(on?RP+RW-26:RP+RW-62,y+RH/2,10,on?acolN:0x334455));
      const lbl=this._reg(this.add.text(on?RP+RW-63:RP+RW-26,y+RH/2,on?'ON':'OFF',{fontFamily:"'Courier New',monospace",fontSize:'8px',color:on?acol:'#445566'}).setOrigin(0.5));
      rowBg.setInteractive({useHandCursor:true});
      rowBg.on('pointerover',()=>rowBg.setFillStyle(acolN,0.08));
      rowBg.on('pointerout', ()=>rowBg.setFillStyle(0x040d06,0.97));
      rowBg.on('pointerdown',()=>{
        const nv=!Settings.get(key);Settings.set(key,nv);
        trkBg.setFillStyle(nv?acolN:0x0a1218,nv?0.18:0.9);
        trkBg.setStrokeStyle(1.5,acolN,nv?0.9:0.3);
        knob.setX(nv?RP+RW-26:RP+RW-62).setFillStyle(nv?acolN:0x334455);
        lbl.setX(nv?RP+RW-63:RP+RW-26).setText(nv?'ON':'OFF').setColor(nv?acol:'#445566');
      });
      y+=RH+GAP;
    };

    const slider=(label,sub,key,max)=>{
      const rowBg=row(label,sub);
      const TW=260,TX=RP+RW-TW-60;
      let val=Settings.get(key)||0.7;
      const track=this._reg(this.add.rectangle(TX+TW/2,y+RH/2,TW,6,0x0d1a22,1).setStrokeStyle(1,acolN,0.3).setInteractive({useHandCursor:true}));
      const fill=this._reg(this.add.rectangle(TX,y+RH/2,TW*(val/max),6,acolN,0.6).setOrigin(0,0.5));
      const knob=this._reg(this.add.circle(TX+TW*(val/max),y+RH/2,7,acolN));
      const pct=this._reg(this.add.text(RP+RW-12,y+RH/2,`${Math.round(val/max*100)}%`,{fontFamily:"'Courier New',monospace",fontSize:'11px',color:acol}).setOrigin(1,0.5));
      const upd=(px)=>{const f=Phaser.Math.Clamp((px-TX)/TW,0,1);fill.width=TW*f;knob.x=TX+TW*f;pct.setText(`${Math.round(f*100)}%`);Settings.set(key,f*max);try{Snd.updateVols&&Snd.updateVols();}catch{}};
      track.on('pointerdown',p=>upd(p.x));
      track.on('pointermove',p=>{if(p.isDown)upd(p.x);});
      y+=RH+GAP;
    };

    const pills=(label,sub,steps,labels,key,cmp)=>{
      const fullRH=RH+22;
      const rowBg=this._reg(this.add.rectangle(RP+RW/2,y,RW,fullRH,0x040d06,0.97).setOrigin(0.5,0));
      rowBg.setStrokeStyle(1,acolN,0.25);
      this._reg(this.add.rectangle(RP,y,3,fullRH,acolN,0.6).setOrigin(0,0));
      this._reg(this.add.rectangle(RP,y,RW,3,acolN,0.4).setOrigin(0,0));
      this._reg(this.add.text(RP+14,y+10,label,{fontFamily:"'Courier New',monospace",fontSize:'13px',fontStyle:'bold',color:acol}));
      this._reg(this.add.text(RP+14,y+30,sub,{fontFamily:"'Courier New',monospace",fontSize:'9px',color:'#4477aa'}));
      let cur=Settings.get(key);
      const btnObjs=steps.map((s,i)=>{
        const act=cmp?cmp(cur,s):cur===s;
        const bx=RP+14+i*(Math.floor((RW-28)/steps.length));
        const bw=Math.floor((RW-28)/steps.length)-6;
        const pbg=this._reg(this.add.rectangle(bx,y+44,bw,20,act?acolN:0x0a1218,act?0.22:0.9).setOrigin(0,0).setStrokeStyle(1,acolN,act?0.9:0.2).setInteractive({useHandCursor:true}));
        const ptxt=this._reg(this.add.text(bx+bw/2,y+54,labels[i],{fontFamily:"'Courier New',monospace",fontSize:'10px',fontStyle:act?'bold':'normal',color:act?acol:'#445566'}).setOrigin(0.5));
        pbg.on('pointerover',()=>{pbg.setFillStyle(acolN,0.15);ptxt.setColor('#ffffff');});
        pbg.on('pointerout', ()=>{const a=cmp?cmp(Settings.get(key),s):Settings.get(key)===s;pbg.setFillStyle(a?acolN:0x0a1218,a?0.22:0.9);ptxt.setColor(a?acol:'#445566');});
        pbg.on('pointerdown',()=>{
          Settings.set(key,s);cur=s;
          btnObjs.forEach((b,j)=>{const a=cmp?cmp(s,steps[j]):s===steps[j];b.bg.setFillStyle(a?acolN:0x0a1218,a?0.22:0.9);b.bg.setStrokeStyle(1,acolN,a?0.9:0.2);b.txt.setColor(a?acol:'#445566').setFontStyle(a?'bold':'normal');});
          if(key==='render_scale')try{_applyRenderScale();}catch{}
        });
        return {bg:pbg,txt:ptxt};
      });
      y+=fullRH+GAP;
    };

    if(cat==='render'){
      toggle('CRT_OVERLAY',   'Scanlines + chromatic aberration + glitch','crt');
      toggle('VIGNETTE',      'Edge darkening overlay around screen borders','vignette');
      toggle('SCREEN_FX',     'Camera shake + flash effects on damage/events','shake');
      toggle('SMOOTH_MOVE',   'Lerp player smoothly to cursor position','smooth');
      toggle('VOICE_SYNTH',   'Speech API system narration','voice');
    } else if(cat==='audio'){
      slider('MUSIC_VOLUME',  'Adaptive background music · 0.0 – 1.5','music',1.5);
      slider('SFX_VOLUME',    'Sound effects and feedback · 0.0 – 1.0','sfx',1.0);
    } else if(cat==='hud'){
      pills('HUD_SCALE',  'Resize all HUD elements globally',
        [0.7,0.85,1.0,1.2,1.4],['XS','SM','MD','LG','XL'],'hud_scale',
        (a,b)=>Math.abs(a-b)<0.05);
      pills('HUD_MARGIN', 'Safe zone from screen edges (px)',
        [4,8,12,18,24],['4px','8px','12px','18px','24px'],'hud_margin');
    } else if(cat==='display'){
      pills('CANVAS_SCALE',  'Sharpness rendering mode',
        [0.5,1,2],['CRISP','SMOOTH','SHARP'],'render_scale',
        (a,b)=>Math.abs(a-b)<0.1);
      pills('WINDOW_MODE', 'Toggle fullscreen display',
        [false,true],['WINDOWED','FULLSCREEN'],'fullscreen');
    }
  }
}

const ENEMY_MUTATIONS=[
  {id:'splitting',   label:'SPLIT',   col:0xff6600, desc:'On death spawns 2 swarms'},
  {id:'magnetic',    label:'MAGNET',  col:0x00aaff, desc:'Pulls reflected bullets toward it'},
  {id:'armored',     label:'ARMOR',   col:0xffdd00, desc:'+1 HP — takes an extra hit'},
  {id:'volatile',    label:'VOLAT',   col:0xaa00ff, desc:'Explodes on death — AoE damage'},
  {id:'phase',       label:'PHASE',   col:0x88ffff, desc:'Teleports when hit below 50% HP'},
  {id:'mirror',      label:'MIRR',    col:0xffffff, desc:'Deflects reflected bullets back'},
  {id:'regenerating',label:'REGEN',   col:0x00ff88, desc:'Slowly heals if not hit for 3s'},
  {id:'overclocked', label:'OVCL',    col:0xff4400, desc:'+50% move speed and fire rate'},
];
function _pickRunMutations(){
  const pool=[...ENEMY_MUTATIONS];
  const a=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
  const b=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
  return [a,b];
}

class GameScene extends Phaser.Scene{
  constructor(){super('GameScene');}

  shutdown(){
    try{
      // Stop all time events first
      if(this.time)this.time.removeAllEvents();
      if(this.tweens)this.tweens.killAll();
      // Clear arrays
      this.particles=[];this.bullets=[];this.enemies=[];this.fragParts=[];
      this.shockRings=[];this.pingRings=[];this.powerups=[];this.hazards=[];
      this.dashTrail=[];this.packetTrace=[];this.nullZones=[];this._ghostEchoes=[];
      // Clear all graphics in chunks via setTimeout to avoid single-frame spike
      const gfxList=[this.gfxMain,this.gfxFx,this.gfxFx2,this.gfxHazard,this.gfxHud,this.gfxBg];
      gfxList.forEach((g,i)=>{
        if(g)setTimeout(()=>{try{g.clear();}catch{}},i*8);
      });
      if(this._backtickListener){window.removeEventListener('keydown',this._backtickListener);this._backtickListener=null;}
      // Stop all time events
      if(this.time)this.time.removeAllEvents();
      // Stop tweens
      if(this.tweens)this.tweens.killAll();
    }catch(e){}
  }

  _showTerminating(onDone){
    // Full screen terminal "terminating" overlay — hides the freeze
    const overlay=this.add.rectangle(W/2,H/2,W,H,0x000000,0).setDepth(200);
    overlay.setAlpha(0);this.tweens.add({targets:overlay,alpha:1,duration:180});

    const lines=[
      {t:0,   txt:'> TERMINATE_PROCESS — SIGNAL LOST',      col:'#ff2244'},
      {t:120, txt:'> KILLING ALL CHILD PROCESSES...',        col:'#ff4444'},
      {t:260, txt:'> FLUSHING MEMORY BUFFERS...',            col:'#882222'},
      {t:400, txt:'> WRITING CORE DUMP...',                  col:'#662222'},
      {t:520, txt:'> CLEARING WARP FIELD ARRAY...',          col:'#441111'},
      {t:640, txt:'> PROCESS TERMINATED — EXIT CODE 0',      col:'#ff2244'},
    ];

    lines.forEach((l,i)=>{
      this.time.delayedCall(l.t,()=>{
        const y=H/2-60+i*22;
        const txt=this.add.text(W/2,y,l.txt,{
          fontFamily:"'Courier New',monospace",fontSize:'13px',color:l.col
        }).setOrigin(0.5).setDepth(201).setAlpha(0);
        this.tweens.add({targets:txt,alpha:1,duration:60});
        if(i===0)CRT&&CRT.glitch&&CRT.glitch(0.5);
      });
    });

    // After lines finish, call onDone
    this.time.delayedCall(900,onDone);
  }

  _goToMenu(){
    try{this._endRun&&this._endRun();}catch{}
    try{Snd._startMenuMusic_resume();}catch{}
    this.shutdown();
    this.cameras.main.fadeOut(280,0,0,0);
    setTimeout(()=>{
      try{
        this.scene.setVisible(false,'GameScene');
        const ms=this.game.scene.getScene('MenuScene');
        if(ms&&ms.sys.isSleeping()){this.scene.wake('MenuScene');}
        else{this.scene.start('MenuScene');}
        setTimeout(()=>{
          try{this.scene.stop('GameScene');}catch{}
          try{this.scene.stop('GameOverScene');}catch{}
          try{this.scene.stop('UpgradeScene');}catch{}
          try{this.scene.stop('OverclockScene');}catch{}
        },300);
      }catch(e){try{this.scene.start('MenuScene');}catch{}}
    },290);
  }

    this.gfxFx2=this.add.graphics().setDepth(15); // extra fx layer

    this._buildGridNodes();
    this._buildUI();
    this._initBgLayers();
    this._initCorruptZones();
    this._setupInput();

    this.banner=new BannerManager(this);

    this.events.on('resume',(_,d)=>{
      if(!d)return;
      // Always clean up any wave clear overlay objects and restore camera
      if(this._waveClearObjs){
        this._waveClearObjs.forEach(o=>{try{o&&o.destroy();}catch{}});
        this._waveClearObjs=null;
      }
      this.cameras.main.resetFX();
      this.cameras.main.fadeIn(500,0,0,0);
      if('upgrade' in d){
        this._applyUpgrade(d.upgrade);
        if(d.overclocked)this._applyOverclock();
        this._startWave();
      }
      CRT.inGame=true; // restore cursor on resume
    try{Snd.startGameMusic();}catch{}
      if(d.bossReady)this._spawnBossNow();
      if(d.fromSettings){
        this.paused=false;this._drawPauseOverlay(false);
        if(window._hudRebuildNeeded){
          window._hudRebuildNeeded=false;
          // Preserve run state and restart scene with it
          this.scene.restart({
            mode:this.mode,
            debugWave:this.wave,
            debugScore:this.score,
            debugUpgrades:this.upg,
            hudRebuilt:true,
          });
        }
      }
    });

    CRT.inGame=true;
    try{Snd.startGameMusic();}catch{}
    this.cameras.main.fadeIn(550,0,0,0);
    // Apply difficulty multipliers
    try{
      const d2=this.diff||DIFFICULTY.daemon;
      const routerOwned=Save.meta('packet_router',false);
    const metaRouterOwned=Save.hasMeta('packet_router');
    this.pingBaseCD=(d2===DIFFICULTY.packet?12:d2===DIFFICULTY.kernel?18:15)-((routerOwned||metaRouterOwned)?5:0);
    }catch(e){console.error('[DIFFICULTY INIT]',e);}
    // Debug mode: restore wave/score/upgrades
    if(this.debugData){
      try{
        const dd=this.debugData;
        this.wave=dd.debugWave-1; // _startWave will increment
        this.score=dd.debugScore||0;
        this.scoreDisplay=this.score;
        if(dd.debugUpgrades)Object.assign(this.upg,dd.debugUpgrades);
        this.banner.show('DEBUG: WAVE RESTORED','#ffaa00',1500);
        this._sysLog('[DEBUG] PROCESS STATE RESTORED FROM CORE DUMP');
      }catch(e){console.error('[DEBUG RESTORE]',e);}
    }
    // Carry over rollback flag so it can't be used again this run
    if(this.debugData&&this.debugData.rollbackUsed)this._rollbackUsed=true;
    // Pick run mutations — 2 random from pool, announced at wave 1
    this._runMutations=_pickRunMutations();
    // Mutation reveal — slides down from top, matches banner style
    if(this._runMutations&&this._runMutations.length>0){
      const LP=130, RP=130;
      const BW=W-LP-RP, BX=LP; // same span as banners
      const PH=58, GAP=4;
      const panels=[];

      const ov=this.add.rectangle(W/2,H/2,W,H,0x000000,0).setDepth(60);
      this.tweens.add({targets:ov,alpha:0.65,duration:280});

      this._runMutations.forEach((m,i)=>{
        const col=m.col;
        const mc='#'+col.toString(16).padStart(6,'0');
        const targetY=8+i*(PH+GAP);
        const startAbove=targetY-(PH+GAP+4);
        const bg  =this.scene?this.add.rectangle(BX,startAbove,BW,PH,0x000000,0.97).setOrigin(0,0).setDepth(62):null;
        if(!bg)return;
        const tbar=this.add.rectangle(BX,startAbove,BW,2,col,0.95).setOrigin(0,0).setDepth(63);
        const bbar=this.add.rectangle(BX,startAbove+PH,BW,1,col,0.2).setOrigin(0,0).setDepth(63);
        const tag =this.add.text(BX+14,startAbove+7,'PROCESS_MODIFIER',{fontFamily:"'Courier New',monospace",fontSize:'8px',color:mc,letterSpacing:2}).setDepth(64);
        const name=this.add.text(BX+14,startAbove+18,m.label,{fontFamily:"'Courier New',monospace",fontSize:'14px',fontStyle:'bold',color:mc,letterSpacing:1}).setDepth(64);
        const desc=this.add.text(BX+14,startAbove+36,m.desc,{fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#557755'}).setDepth(64);
        const objs=[bg,tbar,bbar,tag,name,desc];
        this.time.delayedCall(i*200,()=>{
          this.tweens.add({targets:objs,y:`+=${PH+GAP+4}`,duration:220,ease:'Power3.Out'});
        });
        panels.push(...objs);
      });

      const promptY=8+this._runMutations.length*(PH+GAP)+8;
      const prompt=this.add.text(W/2,promptY,'[ CLICK OR PRESS ANY KEY TO CONTINUE ]',{
        fontFamily:"'Courier New',monospace",fontSize:'11px',color:'#336644',letterSpacing:2
      }).setOrigin(0.5,0).setDepth(64).setAlpha(0);
      this.time.delayedCall(this._runMutations.length*200+200,()=>{
        this.tweens.add({targets:prompt,alpha:1,duration:200});
        this.tweens.add({targets:prompt,alpha:0.15,duration:500,yoyo:true,repeat:-1});
      });
      panels.push(prompt);

      const dismiss=()=>{
        this.input.off('pointerdown',dismiss);
        this.input.keyboard&&this.input.keyboard.off('keydown',dismiss);
        this.tweens.add({targets:panels,y:'-=70',alpha:0,duration:200,ease:'Power2.In',
          onComplete:()=>{
            panels.forEach(o=>{try{o.destroy();}catch{}});
            this.tweens.add({targets:ov,alpha:0,duration:180,onComplete:()=>{try{ov.destroy();}catch{}}});
            this._startWave();
          }
        });
      };
      this.time.delayedCall(this._runMutations.length*200+400,()=>{
        this.input.once('pointerdown',dismiss);
        this.input.keyboard&&this.input.keyboard.once('keydown',dismiss);
      });
    } else {
      this._startWave(); // no mutations — start immediately
    }
  }

  // ─── GRID ────────────────────────────────────────────────
  _buildGridNodes(){
    const cols=W/80+1,rows=H/80+1;
    for(let xi=0;xi<cols;xi++)for(let yi=0;yi<rows;yi++)this.gridNodes.push({x:xi*80,y:yi*80,ox:xi*80,oy:yi*80,vx:0,vy:0});
  }
  _pushGrid(cx,cy,force){
    this.gridNodes.forEach(n=>{const dx=n.ox-cx,dy=n.oy-cy,d=Math.sqrt(dx*dx+dy*dy);if(d<220&&d>0){const f=force*(1-d/220)/d;n.vx+=dx*f;n.vy+=dy*f;}});
  }
  _updateGrid(dt){this.gridNodes.forEach(n=>{n.vx+=(n.ox-n.x)*9*dt;n.vy+=(n.oy-n.y)*9*dt;n.vx*=0.83;n.vy*=0.83;n.x+=n.vx*dt;n.y+=n.vy*dt;});}
  _drawGrid(){
    const st=this.STAGES[this.stage];
    if(this.memDumpActive){
      this.cameras.main.setBackgroundColor('#030f03');
    } else {
      this.cameras.main.setBackgroundColor(st.bg);
    }
    this.gfxGrid.clear();
    const gridCol=this.memDumpActive?0x003300:st.grid;
    const gridAlpha=this.memDumpActive?0.9:1;
    this.gfxGrid.lineStyle(1,gridCol,gridAlpha);
    const cols=W/80+1,rows=H/80+1;
    this.gfxGrid.beginPath();
    for(let xi=0;xi<cols;xi++)for(let yi=0;yi<rows-1;yi++){const a=this.gridNodes[xi*rows+yi],b=this.gridNodes[xi*rows+yi+1];if(a&&b){this.gfxGrid.moveTo(a.x,a.y);this.gfxGrid.lineTo(b.x,b.y);}}
    for(let yi=0;yi<rows;yi++)for(let xi=0;xi<cols-1;xi++){const a=this.gridNodes[xi*rows+yi],b=this.gridNodes[(xi+1)*rows+yi];if(a&&b){this.gfxGrid.moveTo(a.x,a.y);this.gfxGrid.lineTo(b.x,b.y);}}
    this.gfxGrid.strokePath(); // one path for entire grid
    for(let y=0;y<H;y+=4){this.gfxGrid.fillStyle(0x000000,0.018);this.gfxGrid.fillRect(0,y,W,2);}

    // ── Feature 16: Memory sectors — locked grid squares ──
    if(this.memSectors){
      this.memSectors.forEach(ms=>{
        if(ms.hitFlash>0)ms.hitFlash-=0.016;
        const flash=ms.hitFlash>0;
        // Dark fill
        this.gfxGrid.fillStyle(flash?0x00ff44:0x000000,flash?0.4:0.7);
        this.gfxGrid.fillRect(ms.x,ms.y,ms.w,ms.h);
        // Green border — "LOCKED" cell
        const ba=0.3+0.2*Math.sin(this.t*2+ms.x*0.01);
        this.gfxGrid.lineStyle(1,flash?0x00ff44:0x00aa44,flash?0.9:ba);
        this.gfxGrid.strokeRect(ms.x,ms.y,ms.w,ms.h);
        // Corner brackets
        const cs=8;
        this.gfxGrid.lineStyle(1.5,0x00cc44,flash?1:ba*1.5);
        [[ms.x,ms.y],[ms.x+ms.w,ms.y],[ms.x,ms.y+ms.h],[ms.x+ms.w,ms.y+ms.h]].forEach(([cx,cy],ci)=>{
          const sx=ci%2===0?1:-1,sy=ci<2?1:-1;
          this.gfxGrid.beginPath();
          this.gfxGrid.moveTo(cx,cy+sy*cs);this.gfxGrid.lineTo(cx,cy);this.gfxGrid.lineTo(cx+sx*cs,cy);
          this.gfxGrid.strokePath();
        });
        // Center lock symbol — X
        this.gfxGrid.lineStyle(1,0x003322,ba*0.8);
        this.gfxGrid.beginPath();this.gfxGrid.moveTo(ms.x+ms.w*0.3,ms.y+ms.h*0.3);this.gfxGrid.lineTo(ms.x+ms.w*0.7,ms.y+ms.h*0.7);this.gfxGrid.strokePath();
        this.gfxGrid.beginPath();this.gfxGrid.moveTo(ms.x+ms.w*0.7,ms.y+ms.h*0.3);this.gfxGrid.lineTo(ms.x+ms.w*0.3,ms.y+ms.h*0.7);this.gfxGrid.strokePath();
      });
    }

    // ── Dynamic grid lighting ──
    // Player tints nearby intersections cyan
    const px=this.px,py=this.py;
    for(let xi=0;xi<cols;xi++){
      for(let yi=0;yi<rows;yi++){
        const n=this.gridNodes[xi*rows+yi];if(!n)continue;
        const d=Math.hypot(n.x-px,n.y-py);
        if(d<120){
          this.gfxGrid.fillStyle(st.accent,0.12*(1-d/120));
          this.gfxGrid.fillCircle(n.x,n.y,3);
        }
      }
    }
    // Enemies tint nearby intersections their color
    this.enemies.forEach(e=>{
      const eRange=90;
      for(let xi=0;xi<cols;xi++){
        for(let yi=0;yi<rows;yi++){
          const n=this.gridNodes[xi*rows+yi];if(!n)continue;
          const d=Math.hypot(n.x-e.x,n.y-e.y);
          if(d<eRange){
            this.gfxGrid.fillStyle(e.color,0.1*(1-d/eRange));
            this.gfxGrid.fillCircle(n.x,n.y,2.5);
          }
        }
      }
    });

    // ── Per-sector background style ──
    if(this._bgGeom&&!this.memDumpActive){
      const g=this._bgGeom;
      const gfx=this.gfxGrid;
      const t=this.circuitT||0;
      const accent=st.accent;

      if(g.style==='traces'){
        // SURFACE_LAYER: sparse data pulses on circuit traces
        g.traces.forEach(p=>{
          const ex=p.horiz?p.x+p.len:p.x;
          const ey=p.horiz?p.y:p.y+p.len;
          // Dim trace line
          gfx.lineStyle(p.bright?1:0.7,accent,p.bright?0.18:0.07);
          gfx.beginPath();
          gfx.moveTo(p.x,p.y);gfx.lineTo(ex,ey);gfx.strokePath();
          // Junction dot
          gfx.fillStyle(accent,p.bright?0.5:0.18);
          gfx.fillRect(p.x-2,p.y-2,4,4);
          // Travelling pulse dot
          const px2=p.x+(ex-p.x)*p.phase;
          const py2=p.y+(ey-p.y)*p.phase;
          gfx.fillStyle(accent,p.bright?0.9:0.5);
          gfx.fillCircle(px2,py2,p.bright?2.5:1.8);
        });
      }

      if(g.style==='circuit'){
        // KERNEL_SPACE: amber circuit board + heat distortion waves
        g.traces.forEach(p=>{
          const ex=p.horiz?p.x+p.len:p.x;
          const ey=p.horiz?p.y:p.y+p.len;
          gfx.lineStyle(p.bright?1.5:0.8,accent,p.bright?0.22:0.09);
          gfx.beginPath();
          gfx.moveTo(p.x,p.y);gfx.lineTo(ex,ey);gfx.strokePath();
          gfx.fillStyle(accent,p.bright?0.6:0.2);
          gfx.fillRect(p.x-2,p.y-2,4,4);
          // Bright pulse dot
          const px2=p.x+(ex-p.x)*p.phase;
          const py2=p.y+(ey-p.y)*p.phase;
          gfx.fillStyle(p.bright?0xffaa44:accent,p.bright?1.0:0.55);
          gfx.fillCircle(px2,py2,p.bright?3:2);
          if(p.bright){
            // Glow halo
            gfx.fillStyle(accent,0.2);
            gfx.fillCircle(px2,py2,6);
          }
        });
        // Heat distortion — 3 slow wavy lines drifting across screen
        for(let i=0;i<3;i++){
          const yw=H*0.25+i*H*0.25;
          gfx.lineStyle(1,accent,0.05);
          gfx.beginPath(); // heat wave path
          for(let x=0;x<=W;x+=10){
            const yo=Math.sin(x*0.035+t*1.1+i*1.5)*5;
            x===0?gfx.moveTo(x,yw+yo):gfx.lineTo(x,yw+yo);
          }
          gfx.strokePath();
        }
      }

      if(g.style==='glitch'){
        // DEEP_MEMORY: glitch scanlines + pixel noise + RGB ghost stripes
        g.glitchLines.forEach(l=>{
          const a=l.a*(0.5+0.5*Math.sin(l.t*4));
          gfx.fillStyle(0xaaaaff,a);
          gfx.fillRect(l.x,l.y,l.w,1.5);
        });
        g.traces.forEach(p=>{
          const v=0.5+0.5*Math.sin(p.blink);
          if(v>0.4){gfx.fillStyle(accent,p.a*v);gfx.fillCircle(p.x,p.y,p.r);}
        });
        // RGB ghost stripes — corrupted old sector data bleeding through
        [[0xff4444,H*0.22],[0x4444ff,H*0.5],[0x44ff44,H*0.78]].forEach(([c,yw])=>{
          const yo=Math.sin(t*0.25)*12;
          gfx.lineStyle(1,c,0.04);
          gfx.beginPath();
          gfx.moveTo(0,yw+yo);gfx.lineTo(W,yw+yo);gfx.strokePath();
        });
      }

      if(g.style==='fractal'){
        // SECTOR_00: rotating crystalline geometry
        g.fractalNodes.forEach(fn=>{
          const pulse=0.7+0.3*Math.sin(t*1.5+fn.rot);
          gfx.lineStyle(1,accent,fn.a*pulse);
          // Outer polygon
          gfx.beginPath();
          for(let s=0;s<fn.sides;s++){
            const a=fn.rot+(Math.PI*2/fn.sides)*s;
            s===0?gfx.moveTo(fn.x+Math.cos(a)*fn.r,fn.y+Math.sin(a)*fn.r)
                 :gfx.lineTo(fn.x+Math.cos(a)*fn.r,fn.y+Math.sin(a)*fn.r);
          }
          gfx.closePath();gfx.strokePath();
          // Inner polygon (counter-rotate, half size)
          gfx.lineStyle(1,accent,fn.a*0.4*pulse);
          gfx.beginPath();
          for(let s=0;s<fn.sides;s++){
            const a=-fn.rot+(Math.PI*2/fn.sides)*s;
            s===0?gfx.moveTo(fn.x+Math.cos(a)*fn.r*0.5,fn.y+Math.sin(a)*fn.r*0.5)
                 :gfx.lineTo(fn.x+Math.cos(a)*fn.r*0.5,fn.y+Math.sin(a)*fn.r*0.5);
          }
          gfx.closePath();gfx.strokePath();
        });
        // Connecting lines between nearby nodes
        for(let i=0;i<g.fractalNodes.length-1;i++){
          const a=g.fractalNodes[i],b2=g.fractalNodes[i+1];
          const d=Math.hypot(a.x-b2.x,a.y-b2.y);
          if(d<220){
            gfx.lineStyle(1,accent,0.05*(1-d/220));
            gfx.beginPath();
            gfx.moveTo(a.x,a.y);gfx.lineTo(b2.x,b2.y);gfx.strokePath();
          }
        }
      }
    }
  }

  _initBgLayers(){
    this.circuitT=0;
    this._bgGeom=null;      // pre-generated geometry for current sector
    this._generateBgGeom(0); // generate for sector 0 on start
  }

  _generateBgGeom(stageIdx){
    const st=this.STAGES[stageIdx]||this.STAGES[0];
    const geom={style:st.bgStyle,accent:st.accent,traces:[],glitchLines:[],fractalNodes:[]};
    if(st.bgStyle==='traces'||st.bgStyle==='circuit'){
      // 40 random H/V trace segments on 80px grid
      for(let i=0;i<40;i++){
        const gx=Math.floor(Math.random()*(W/80))*80;
        const gy=Math.floor(Math.random()*(H/80))*80;
        const horiz=Math.random()<0.5;
        const len=(1+Math.floor(Math.random()*5))*80;
        geom.traces.push({x:gx,y:gy,len,horiz,
          phase:Math.random(),spd:0.3+Math.random()*0.5,
          bright:Math.random()<0.25});
      }
    }
    if(st.bgStyle==='glitch'){
      for(let i=0;i<22;i++){
        geom.glitchLines.push({
          y:Math.random()*H,
          x:Math.random()*W,
          w:40+Math.random()*350,
          a:0.02+Math.random()*0.06,
          spd:(Math.random()-0.5)*18,
          t:Math.random()*5
        });
      }
      // Pixel noise clusters
      for(let i=0;i<55;i++){
        geom.traces.push({
          x:Math.random()*W,y:Math.random()*H,
          r:1+Math.random()*2,a:0.08+Math.random()*0.25,
          blink:Math.random()*Math.PI*2,blinkSpd:2+Math.random()*6
        });
      }
    }
    if(st.bgStyle==='fractal'){
      for(let i=0;i<14;i++){
        geom.fractalNodes.push({
          x:100+Math.random()*(W-200),
          y:60+Math.random()*(H-120),
          r:28+Math.random()*70,
          rot:Math.random()*Math.PI,
          rotSpd:(Math.random()-0.5)*0.25,
          sides:4+Math.floor(Math.random()*4),
          a:0.07+Math.random()*0.1
        });
      }
    }
    this._bgGeom=geom;
  }

  _initCorruptZones(){
    for(let i=0;i<4;i++){
      this.corruptZones.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*15,vy:(Math.random()-0.5)*15,rx:80+Math.random()*120,ry:50+Math.random()*80,a:0.12+Math.random()*0.1,rot:Math.random()*Math.PI});

  }

  // ─── INPUT ───────────────────────────────────────────────
  _setupInput(){
    this.dashCooldownT=0;
    this.isDashing=false;
    this.dashTargetX=0;this.dashTargetY=0;
    this.dashTrail=[];
    this.glitchSplit=0;       // RGB split duration on player
    this.packetTrace=[];      // recent movement path points
    this.sysLogLines=[];      // terminal feed lines
    this.sysLogT=0;           // log scroll timer
    this.bootEnemies=[];      // enemies in boot-sequence materializing
    this.shockRings=[];       // chain shockwave rings
    this.fragParts=[];        // shape death fragments
    this.movTrail=[];         // data fragmentation movement trail
    this._ghostTraceT=0;      // ghost_trace damage tick timer
    this._statsOpen=false;     // stats overlay flag
    this._devOpen=false;       // dev overlay flag
    this._sandbox=false;       // sandbox mode — no auto spawns
    this._devTab=0;            // active dev tab index
    this._devGodMode=false;    // god mode flag
    this.bossRelics=[];        // relics dropped by bosses
    this._packetWallCount=0;   // PACKET_WALL relic counter
    this._gravEchoActive=[];   // GRAVITY_ECHO orbiting bullets
    this._phaseCloneT=0;       // PHASE_CLONE timer
    this.corruptZones=[];     // drifting corruption zones
    this.scoreDisplay=0;      // animated score display
    this.chargeIndicators=[]; // bullet charge-up dots

    this.input.on('pointerdown',p=>{
      this.fingerDown=true;
      const dist=Math.hypot(p.x-this.px,p.y-this.py);
      if(dist>160&&this.dashCooldownT<=0&&!this.isDashing){
        // FAR CLICK — dash toward cursor at high speed
        this.isDashing=true;
        this._dashOriginX=this.px;this._dashOriginY=this.py;
        this.dashTargetX=Phaser.Math.Clamp(p.x,20,W-20);
        this.dashTargetY=Phaser.Math.Clamp(p.y,20,H-20);
        this.invincT=0.5;
        this.dashCooldownT=this._dashCooldownOverride||1.2;
        this.dashActiveT=0.4;
        // PHASE_CLONE relic — schedule burst at origin
        if(this.bossRelics&&this.bossRelics.find(r=>r.id==='PHASE_CLONE')){
          this._phaseCloneOrigin={x:this.px,y:this.py};
          this._phaseCloneT=1.0;
        }
        // Don't collapse bubble — restore after arriving
        Snd.play('reflect');
        CRT.glitch(0.08);
      } else {
        this.tx=p.x;this.ty=p.y;
        if(!this.bubbleOverheated)this.pressing=true;
      }
    });
    this.input.on('pointermove',p=>{
      if(p.isDown&&!this.isDashing){this.tx=p.x;this.ty=p.y;}
    });
    this.input.on('pointerup',()=>{
      this.pressing=false;
      this.fingerDown=false;
    });
    // ESC disabled — use TAB for the combined menu
    this.input.keyboard&&this.input.keyboard.on('keydown-SPACE',()=>this._activateActivePower());
    this.input.keyboard&&this.input.keyboard.on('keydown-R',()=>{if(this.signal>=1&&!this.surgeActive)this._activateSurge();});
    if(this.input.keyboard){
      this.input.keyboard.removeListener('keydown-TAB');
      this.input.keyboard.on('keydown-TAB',(e)=>{try{e.preventDefault();}catch{}this._openStats();});
      this.input.keyboard.removeListener('keydown-BACKTICK');
      this.input.keyboard.on('keydown-BACKTICK',(e)=>{try{e.preventDefault();}catch{}this._toggleDevOverlay();});
      // Backtick via raw DOM — keyCode 192 / key '`'
      if(this._backtickListener){window.removeEventListener('keydown',this._backtickListener);}
      this._backtickListener=(e)=>{if(e.keyCode===192||e.key==='`'){e.preventDefault();this._toggleDevOverlay();}};
      window.addEventListener('keydown',this._backtickListener);
    }
  }

  _drawPauseOverlay(show){
