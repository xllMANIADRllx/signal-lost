      this.add.text(W-16,14,'NOT FOR RELEASE',{fontFamily:"'Courier New',monospace",fontSize:'11px',color:'#664400'}).setOrigin(1,0.5);

      // ── Live stats bar ──
      this.add.rectangle(W/2,48,W,20,0x001100,0.9).setOrigin(0.5,0);
      this.statsTxt=this.add.text(12,58,'',{fontFamily:"'Courier New',monospace",fontSize:'11px',color:'#00cc55'}).setOrigin(0,0.5);

      // ── Section layout ──
      // Left column: Game State | Visual Debug
      // Center column: Upgrades | Testing
      // Right column: Save | Audio
      const COL=[170,490,810];
      const SEC_Y=82;
      const W_COL=290;

      // ── Helper: section header ──
      const secHead=(x,y,label)=>{
        this.add.rectangle(x,y,W_COL,22,0x001a00,1).setOrigin(0.5,0);
        this.add.rectangle(x-W_COL/2,y,2,22,0x00ff44,0.7).setOrigin(0,0);
        this.add.text(x-W_COL/2+8,y+10,label,{fontFamily:"'Courier New',monospace",fontSize:'12px',fontStyle:'bold',color:'#00ff44'}).setOrigin(0,0.5);
      };

      // ── Helper: button ──
      const btn=(x,y,label,col,cb)=>{
        col=col||'#00cc44';
        const bg=this.add.rectangle(x,y,W_COL-10,22,0x000000,0.9).setOrigin(0.5,0).setInteractive({useHandCursor:true});
        this.add.rectangle(x-W_COL/2+5,y,2,22,parseInt(col.replace('#',''),16),0.5).setOrigin(0,0);
        const t=this.add.text(x-W_COL/2+14,y+11,`> ${label}`,{fontFamily:"'Courier New',monospace",fontSize:'12px',color:col}).setOrigin(0,0.5);
        bg.on('pointerover',()=>{bg.setFillStyle(0x002200);t.setColor('#ffffff');});
        bg.on('pointerout',()=>{bg.setFillStyle(0x000000);t.setColor(col);});
        bg.on('pointerdown',()=>{try{cb();}catch(err){this._log('[ERR] '+err.message,'#ff4444');}});
        return {bg,t};
      };

      // ── Helper: number input button pair ──
      const numBtn=(x,y,label,col,getCb,setCb)=>{
        this.add.text(x-W_COL/2+14,y+11,label,{fontFamily:"'Courier New',monospace",fontSize:'12px',color:'#336644'}).setOrigin(0,0.5);
        const valT=this.add.text(x+30,y+9,'',{fontFamily:"'Courier New',monospace",fontSize:'11px',color:col||'#00cc44'}).setOrigin(0.5,0.5);
        const upd=()=>valT.setText(String(getCb()));
        upd();
        const mkB=(bx,dir,amt)=>{
          const b=this.add.rectangle(bx,y+9,22,16,0x001a00,1).setOrigin(0.5,0.5).setInteractive({useHandCursor:true});
          this.add.text(bx,y+9,dir>0?'+':'-',{fontFamily:"'Courier New',monospace",fontSize:'10px',color:col||'#00cc44'}).setOrigin(0.5,0.5);
          b.on('pointerdown',()=>{setCb(getCb()+dir*amt);upd();});
          b.on('pointerover',()=>b.setFillStyle(0x003300));
          b.on('pointerout',()=>b.setFillStyle(0x001a00));
        };
        mkB(x+75,1,1);mkB(x+99,1,10);
        mkB(x-15,-1,1);mkB(x-39,-1,10);
      };

      // ── Helper: toggle button ──
      const tog=(x,y,label,col,getCb,setCb)=>{
        const bg=this.add.rectangle(x,y,W_COL-10,22,0x000000,0.9).setOrigin(0.5,0).setInteractive({useHandCursor:true});
        this.add.rectangle(x-W_COL/2+5,y,2,22,parseInt((col||'#00cc44').replace('#',''),16),0.5).setOrigin(0,0);
        const t=this.add.text(x-W_COL/2+14,y+11,'',{fontFamily:"'Courier New',monospace",fontSize:'12px'}).setOrigin(0,0.5);
        const upd=()=>{const v=getCb();t.setText(`> ${label}: ${v?'ON':'OFF'}`).setColor(v?col||'#00cc44':'#224433');};
        upd();
        bg.on('pointerdown',()=>{setCb(!getCb());upd();});
        bg.on('pointerover',()=>bg.setFillStyle(0x002200));
        bg.on('pointerout',()=>bg.setFillStyle(0x000000));
        return upd;
      };

      // Dev state — all scoped to DevScene, applied via GameScene globals
      if(!window.DEV)window.DEV={
        invincible:false, oneHit:false, showHitboxes:false,
        showLabels:false, showFPS:false, noParticles:false,
        wave:1, score:0, shards:Save.shards(),
        skin:'ranger',
      };

      // ══════════════════════════════════════════
      // COL 0: GAME STATE CONTROL
      // ══════════════════════════════════════════
      let y=SEC_Y;
      secHead(COL[0],y,'// GAME STATE'); y+=26;
      numBtn(COL[0],y,'WAVE',  '#00cc44',()=>window.DEV.wave,    v=>window.DEV.wave=Math.max(1,Math.min(20,v))); y+=22;
      numBtn(COL[0],y,'SCORE', '#ffdd00',()=>window.DEV.score,   v=>window.DEV.score=Math.max(0,v)); y+=22;
      numBtn(COL[0],y,'SHARDS','#ccaa00',()=>window.DEV.shards,  v=>window.DEV.shards=Math.max(0,v)); y+=22;
      btn(COL[0],y,'LAUNCH WITH DEV STATE','#00ff44',()=>{
        Save.set('shards',window.DEV.shards);
        this.cameras.main.fadeOut(250,0,0,0);
        this.time.delayedCall(250,()=>{
          this.scene.start('GameScene',{mode:'dev',debugWave:window.DEV.wave,debugScore:window.DEV.score,debugUpgrades:null});
        });
      }); y+=24;

      secHead(COL[0],y,'// TOGGLES'); y+=22;
      const tInvinc=tog(COL[0],y,'INVINCIBLE','#00ffcc',()=>window.DEV.invincible,v=>{window.DEV.invincible=v;}); y+=20;
      const tOneHit=tog(COL[0],y,'ONE HIT KILL','#ff4444',()=>window.DEV.oneHit,v=>{window.DEV.oneHit=v;}); y+=20;
      const tHitbox=tog(COL[0],y,'SHOW HITBOXES','#ff8800',()=>window.DEV.showHitboxes,v=>{window.DEV.showHitboxes=v;}); y+=20;
      const tLabels=tog(COL[0],y,'SHOW LABELS','#ffdd00',()=>window.DEV.showLabels,v=>{window.DEV.showLabels=v;}); y+=20;
      const tFPS=tog(COL[0],y,'SHOW FPS','#00aaff',()=>window.DEV.showFPS,v=>{window.DEV.showFPS=v;}); y+=20;
      const tParts=tog(COL[0],y,'NO PARTICLES','#aa00ff',()=>window.DEV.noParticles,v=>{window.DEV.noParticles=v;}); y+=24;

      secHead(COL[0],y,'// SKIN SELECT'); y+=22;
      Object.values(SHIPS).forEach(s=>{
        btn(COL[0],y,`${s.name} (${s.id})`,window.DEV.skin===s.id?'#00ff44':'#224433',()=>{
          window.DEV.skin=s.id;Save.setSkin(s.id);
          if(!Save.isOwned(s.id)){Save.own(s.id);}
          this._log(`Skin set: ${s.id}`);
        }); y+=20;
      });

      // ══════════════════════════════════════════
      // COL 1: SPAWN / TEST FEATURES
      // ══════════════════════════════════════════
      y=SEC_Y;
      secHead(COL[1],y,'// SPAWN CONTROL'); y+=22;
      ['grunt','sniper','tank','swarm','rootkit'].forEach(type=>{
        btn(COL[1],y,`SPAWN ${type.toUpperCase()}`, '#ff8800',()=>{
          this._log(`Spawn ${type} — launch game first`);
          window.DEV.spawnEnemy=type;
        }); y+=20;
      });
      btn(COL[1],y,'SPAWN BOSS','#ff2244',()=>{window.DEV.spawnBoss=true;this._log('Boss will spawn on next game launch');}); y+=20;
      btn(COL[1],y,'CLEAR ALL ENEMIES','#ff4444',()=>{window.DEV.clearEnemies=true;this._log('Enemies cleared on next frame');}); y+=20;
      btn(COL[1],y,'FORCE WAVE CLEAR','#00ffcc',()=>{window.DEV.forceWaveClear=true;this._log('Wave clear queued');}); y+=24;

      secHead(COL[1],y,'// TRIGGER EVENTS'); y+=22;

          catch(e){this._log('[ERR] '+e.message,'#ff4444');}

      btn(COL[2],y,'TEST ALL SOUNDS',   '#00aaff',()=>{

      back.on('pointerover',()=>{backBg.setFillStyle(0x330000);back.setColor('#ffffff');});
      back.on('pointerout',()=>{backBg.setFillStyle(0x110000);back.setColor('#ff4444');});

      this.input.keyboard.on('keydown-ESC',goBack);

      this._log('DEV CONSOLE READY — signal_lost debug build');
      this._statsTimer=this.time.addEvent({delay:500,loop:true,callback:this._updateStats,callbackScope:this});

    }catch(err){console.error('[DEV SCENE ERROR]',err);}
  }

  _log(msg,col){
    try{
      if(!this._logLines)return;
      col=col||'#00cc44';
      const ts=new Date().toTimeString().slice(0,8);
      const line=`[${ts}] ${msg}`;
      this._logHistory=(this._logHistory||[]);
      this._logHistory.unshift({line,col});
      this._logHistory=this._logHistory.slice(0,4);
      this._logLines.forEach((t,i)=>{
        const entry=this._logHistory[i];
        t.setText(entry?entry.line:'').setColor(entry?entry.col:'#00cc44');
      });
    }catch(e){}
  }

  _updateStats(){
    try{
      const d=window.DEV||{};
      this.statsTxt&&this.statsTxt.setText(
        `WAVE:${d.wave||1}  SCORE:${d.score||0}  SHARDS:${Save.shards()}  SKIN:${d.skin||'ranger'}  `+
        `INV:${d.invincible?'ON':'OFF'}  1HIT:${d.oneHit?'ON':'OFF'}  HBX:${d.showHitboxes?'ON':'OFF'}  `+
        `LABELS:${d.showLabels?'ON':'OFF'}  FPS:${d.showFPS?'ON':'OFF'}`
      );
    }catch(e){}
  }
}

class ArchetypeSelectScene extends Phaser.Scene{
  constructor(){super('ArchetypeSelectScene');}
  create(d){
    try{CRT.inGame=false;}catch(e){}
    this._data=d||{};
    this._selected=null;
    this.cameras.main.setBackgroundColor('#020804');
    this.cameras.main.fadeIn(320,0,0,0);

    // Background grid
    const g=this.add.graphics();
    g.lineStyle(1,0x00cc66,0.08);
    g.beginPath();
    for(let x=0;x<=W;x+=80){g.moveTo(x,0);g.lineTo(x,H);}
    for(let y=0;y<=H;y+=80){g.moveTo(0,y);g.lineTo(W,y);}
    g.strokePath();

    // Header
    this.add.rectangle(W/2,0,W,42,0x000000,0.97).setOrigin(0.5,0);
    this.add.rectangle(W/2,42,W,2,0x00cc66,0.6).setOrigin(0.5,0);
    this.add.text(W/2,20,'SELECT_ARCHETYPE.SH',{
      fontFamily:"'Orbitron',sans-serif",fontSize:'20px',fontStyle:'900',color:'#00ff88',letterSpacing:6
    }).setOrigin(0.5);

    // Vertical divider
    const DIV=W/2;
    this.add.rectangle(DIV,H/2+21,1,H-42,0x003322,0.6).setOrigin(0.5,0.5);

    // ── RIGHT PANEL — archetype list ──
    const RP=DIV+20;
    const RW=W-RP-20;
    this.add.text(RP,52,'// AVAILABLE_ARCHETYPES',{
      fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#336644'
    });

    this._listCards={};
    ARCHETYPES.forEach((arch,i)=>{
      const ac=arch.col;
      const acS='#'+ac.toString(16).padStart(6,'0');
      const y=68+i*(68+8);

      const card=this.add.rectangle(RP,y,RW,68,0x020a04,0.97).setOrigin(0,0)
        .setStrokeStyle(1,ac,0.4).setInteractive({useHandCursor:true});
      const bar=this.add.rectangle(RP,y,4,68,ac,0.6).setOrigin(0,0);

      // Icon circle
      const iconGfx=this.add.graphics();
      iconGfx.fillStyle(ac,0.12);iconGfx.fillCircle(RP+30,y+34,22);
      iconGfx.lineStyle(1.5,ac,0.6);iconGfx.strokeCircle(RP+30,y+34,22);
      const iconTxt=this.add.text(RP+30,y+34,arch.icon,{
        fontFamily:"'Courier New',monospace",fontSize:'18px',color:acS
      }).setOrigin(0.5);

      const nameTxt=this.add.text(RP+60,y+12,arch.name,{
        fontFamily:"'Orbitron',sans-serif",fontSize:'14px',fontStyle:'900',color:acS
      });
      const tagTxt=this.add.text(RP+60,y+34,arch.tagline,{
        fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#336644',
        wordWrap:{width:RW-70}
      });
      const pwrTxt=this.add.text(RP+RW-4,y+54,`PWR: ${arch.power.replace(/_/g,' ').toUpperCase()}`,{
        fontFamily:"'Courier New',monospace",fontSize:'9px',color:acS
      }).setOrigin(1,0).setAlpha(0.7);

      this._listCards[arch.id]={card,bar,iconGfx,nameTxt,acS,ac};

      card.on('pointerover',()=>{
        if(this._selected!==arch.id){
          card.setFillStyle(ac,0.10);
          card.setStrokeStyle(1,ac,0.75);
        }
      });
      card.on('pointerout',()=>{
        if(this._selected!==arch.id){
          card.setFillStyle(0x020a04,0.97);
          card.setStrokeStyle(1,ac,0.4);
        }
      });
      card.on('pointerdown',()=>this._preview(arch));
    });

    // ── LEFT PANEL — detail card (starts empty) ──
    const LP=20;
    const LW=DIV-40;

    // Placeholder before selection
    this._placeholder=this.add.text(DIV/2,H/2,'// select an archetype',{
      fontFamily:"'Courier New',monospace",fontSize:'13px',color:'#2d6644'
    }).setOrigin(0.5);
    this._placeholderSub=this.add.text(DIV/2,H/2+20,'from the list on the right',{
      fontFamily:"'Courier New',monospace",fontSize:'11px',color:'#336644'
    }).setOrigin(0.5);

    // Detail card objects — hidden until selection
    this._detailBg=this.add.rectangle(LP,48,LW,H-76,0x020a04,0).setOrigin(0,0);
    this._detailBorder=this.add.rectangle(LP,48,LW,H-76).setStrokeStyle(2,0x00ffcc,0).setOrigin(0,0);
    this._detailTopBar=this.add.rectangle(LP,48,LW,4,0x00ffcc,0).setOrigin(0,0);

    // Icon circle — large
    this._detailIconBg=this.add.graphics().setAlpha(0);
    this._detailIconTxt=this.add.text(DIV/2-100,H/2-60,'',{
      fontFamily:"'Courier New',monospace",fontSize:'52px',color:'#00ffcc'
    }).setOrigin(0.5).setAlpha(0);

    // Name
    this._detailName=this.add.text(LP+20,130,'',{
      fontFamily:"'Orbitron',sans-serif",fontSize:'28px',fontStyle:'900',color:'#00ffcc'
    }).setAlpha(0);

    // Tagline
    this._detailTagline=this.add.text(LP+20,170,'',{
      fontFamily:"'Courier New',monospace",fontSize:'12px',color:'#55aa77',letterSpacing:1
    }).setAlpha(0);

    // Divider
    this._detailDiv=this.add.rectangle(LP+10,192,LW-20,1,0x003322,0).setOrigin(0,0);

    // Desc label + text
    this._detailDescLabel=this.add.text(LP+20,202,'DESCRIPTION',{
      fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#336644'
    }).setAlpha(0);
    this._detailDesc=this.add.text(LP+20,218,'',{
      fontFamily:"'Courier New',monospace",fontSize:'12px',color:'#44aa66',
      wordWrap:{width:LW-40}
    }).setAlpha(0);

    // Passive label + text
    this._detailPassiveLabel=this.add.text(LP+20,262,'PASSIVE',{
      fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#336644'
    }).setAlpha(0);
    this._detailPassive=this.add.text(LP+20,278,'',{
      fontFamily:"'Courier New',monospace",fontSize:'12px',color:'#44aa66',
      wordWrap:{width:LW-40}
    }).setAlpha(0);

    // Power label + text
    this._detailPowerLabel=this.add.text(LP+20,322,'ACTIVE POWER',{
      fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#336644'
    }).setAlpha(0);
    this._detailPower=this.add.text(LP+20,338,'',{
      fontFamily:"'Orbitron',sans-serif",fontSize:'14px',fontStyle:'900',color:'#00ffcc'
    }).setAlpha(0);

    // Seeds
    this._detailSeedsLabel=this.add.text(LP+20,374,'STARTING UPGRADES',{
      fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#336644'
    }).setAlpha(0);
    this._detailSeeds=this.add.text(LP+20,390,'',{
      fontFamily:"'Courier New',monospace",fontSize:'11px',color:'#44aa66'
    }).setAlpha(0);

    // Confirm button
    this._confirmBg=this.add.rectangle(LP+LW/2,H-38,LW-20,36,0x000000,0)
      .setStrokeStyle(2,0x00ffcc,0).setInteractive({useHandCursor:true});
    this._confirmTxt=this.add.text(LP+LW/2,H-38,'',{
      fontFamily:"'Courier New',monospace",fontSize:'13px',fontStyle:'bold',color:'#00ffcc'
    }).setOrigin(0.5).setAlpha(0);
    this._confirmBg.on('pointerover',()=>{if(this._selected)this._confirmBg.setFillStyle(0x00ffcc,0.14);});

    this._confirmBg.on('pointerdown',()=>{
      if(!this._selected)return;
      const arch=ARCHETYPES.find(a=>a.id===this._selected);
      if(arch)this._select(arch);
    });

    // Back button
    const backFn=()=>{
      this.cameras.main.fadeOut(220,0,0,0);
      this.time.delayedCall(220,()=>{
        this.scene.stop('ArchetypeSelectScene');
        const ms=this.scene.get('MenuScene');
        if(ms&&ms.sys.isSleeping())this.scene.wake('MenuScene');
        else this.scene.start('MenuScene');
      });
    };
    this.input.keyboard&&this.input.keyboard.on('keydown-ESC',backFn);
    const backBg=this.add.rectangle(W-140,H-38,220,30,0x000000,0.9)
      .setStrokeStyle(1,0x224433,0.5).setInteractive({useHandCursor:true});
    const backTxt=this.add.text(W-140,H-38,'[ ← BACK ]',{
      fontFamily:"'Courier New',monospace",fontSize:'12px',color:'#336644'
    }).setOrigin(0.5);
    backBg.on('pointerover',()=>{backBg.setStrokeStyle(1,0x00cc66,0.7);backTxt.setColor('#00cc66');});
    backBg.on('pointerout', ()=>{backBg.setStrokeStyle(1,0x224433,0.5);backTxt.setColor('#336644');});
    backBg.on('pointerdown',backFn);
  }

  _preview(arch){
    const ac=arch.col;
    const acS='#'+ac.toString(16).padStart(6,'0');

    // Update selected state on list cards
    if(this._selected&&this._listCards[this._selected]){
      const prev=this._listCards[this._selected];
      prev.card.setFillStyle(0x020a04,0.97);
      prev.card.setStrokeStyle(1,prev.ac,0.4);
      prev.bar.setAlpha(0.6);
    }
    this._selected=arch.id;
    const lc=this._listCards[arch.id];
    lc.card.setFillStyle(ac,0.14);
    lc.card.setStrokeStyle(2,ac,0.9);
    lc.bar.setAlpha(1);

    // Hide placeholder
    this._placeholder.setAlpha(0);
    this._placeholderSub.setAlpha(0);

    // Update detail card colors
    this._detailBg.setFillStyle(ac,0.07).setAlpha(1);
    this._detailBorder.setStrokeStyle(2,ac,0.7).setAlpha(1);
    this._detailTopBar.setFillStyle(ac,1).setAlpha(1);
    this._detailDiv.setFillStyle(ac,0.4).setAlpha(1);

    // Icon
    this._detailIconBg.clear().setAlpha(1);
    this._detailIconBg.fillStyle(ac,0.12);this._detailIconBg.fillCircle(80,110,46);
    this._detailIconBg.lineStyle(2,ac,0.7);this._detailIconBg.strokeCircle(80,110,46);
    this._detailIconTxt.setPosition(80,110).setText(arch.icon).setColor(acS).setAlpha(1);

    // Text content
    this._detailName.setText(arch.name).setColor(acS).setAlpha(1);
    this._detailTagline.setText(arch.tagline).setAlpha(1);
    this._detailDescLabel.setAlpha(1);
    this._detailDesc.setText(arch.desc).setAlpha(1);
    this._detailPassiveLabel.setAlpha(1);
    this._detailPassive.setText('▸ '+arch.passive).setAlpha(1);
    this._detailPowerLabel.setAlpha(1);
    this._detailPower.setText('[ '+arch.power.replace(/_/g,' ').toUpperCase()+' ]').setColor(acS).setAlpha(1);
    this._detailSeedsLabel.setAlpha(1);
    const seedStr=Object.entries(arch.seeds).map(([k,v])=>`${k.toUpperCase()} T${v}`).join('   ');
    this._detailSeeds.setText(seedStr).setAlpha(1);

    // Confirm button
    this._confirmBg.setStrokeStyle(2,ac,0.85).setAlpha(1);
    this._confirmTxt.setText(`[ INITIALIZE WITH ${arch.name} ]`).setColor(acS).setAlpha(1);

    // Pulse confirm button once
    this.tweens.add({targets:this._confirmBg,scaleX:{from:0.97,to:1},scaleY:{from:0.97,to:1},duration:120,ease:'Back.Out'});

    Snd.play('powerup');
  }

  _select(arch){
    Snd.init();Snd.play('archetype');
    if(Settings.get('shake'))this.cameras.main.flash(200,(arch.col>>16)&0xff,(arch.col>>8)&0xff,arch.col&0xff,0.15);
    Save.set('equipped_power',arch.power);
    this.cameras.main.fadeOut(300,0,0,0);
    this.time.delayedCall(300,()=>{
      this.scene.stop('ArchetypeSelectScene');
      const nextScene=this._data.mode==='corrupted'?'CorruptedBriefingScene':'BootScene';
      this.scene.start(nextScene,{
        mode:this._data.mode,
        archetype:arch.id,
        archetypeSeeds:arch.seeds,
        archetypePower:arch.power,
        // Pass through daily challenge data if present
        challengeId:this._data.challengeId||null,
        challengeReward:this._data.challengeReward||null,
        challengeLabel:this._data.challengeLabel||null,
        challengeDesc:this._data.challengeDesc||null,
        challengeDiff:this._data.challengeDiff||null,
      });
    });
  }
}

// ═══════════════════════════════════════════════════════════
// META UPGRADE SCENE
// ═══════════════════════════════════════════════════════════
class MetaUpgradeScene extends Phaser.Scene{
  constructor(){super('MetaUpgradeScene');}
  create(){
    try{CRT.inGame=false;}catch(e){}
    this.cameras.main.setBackgroundColor('#020c05');
    this.cameras.main.fadeIn(260,0,0,0);
    const mono="'Courier New',monospace", orb="'Orbitron',sans-serif";

    // ── Layout constants ──
    const HDR_H=44, FTR_H=64, SB_W=300;
    const CONTENT_Y=HDR_H, CONTENT_H=H-HDR_H-FTR_H;
    const DETAIL_X=SB_W;

    // ── Background grid ──
    const bg=this.add.graphics().setAlpha(0.06);
    bg.lineStyle(1,0x00ff66,1);
    for(let x=0;x<=W;x+=80){bg.moveTo(x,0);bg.lineTo(x,H);}
    for(let y=0;y<=H;y+=80){bg.moveTo(0,y);bg.lineTo(W,y);}
    bg.strokePath();

    // ── Scanlines ──
    const sl=this.add.graphics().setAlpha(0.025).setDepth(50);
    for(let y=0;y<H;y+=4){sl.fillStyle(0x000000,1);sl.fillRect(0,y,W,2);}

    // ── Header ──
    this.add.rectangle(W/2,0,W,HDR_H,0x000000,0.97).setOrigin(0.5,0);
    this.add.rectangle(W/2,HDR_H,W,1.5,0x00ff66,0.9).setOrigin(0.5,0);
    this.add.text(20,HDR_H/2,'NETWORK_UPGRADES.SH',{fontFamily:orb,fontSize:'16px',fontStyle:'900',color:'#00ff66',letterSpacing:5}).setOrigin(0,0.5);
    this.add.text(W/2,HDR_H/2,'// PERMANENT UPGRADES — PERSIST ACROSS ALL RUNS',{fontFamily:mono,fontSize:'10px',color:'#1a5530',letterSpacing:1}).setOrigin(0.5);
    this._fragTxt=this.add.text(W-20,HDR_H/2,'',{fontFamily:mono,fontSize:'13px',fontStyle:'bold',color:'#00cc66',letterSpacing:2}).setOrigin(1,0.5);

    // ── Sidebar panel ──
    this.add.rectangle(0,CONTENT_Y,SB_W,CONTENT_H,0x000000,0.88).setOrigin(0,0);
    this.add.rectangle(SB_W,CONTENT_Y,1,CONTENT_H,0x0a2818,1).setOrigin(0,0);

    // Filter bar
    this.add.rectangle(0,CONTENT_Y,SB_W,32,0x000000,0.95).setOrigin(0,0);
    this.add.rectangle(0,CONTENT_Y+32,SB_W,1,0x071a0f,1).setOrigin(0,0);
    this._filterTxt=this.add.text(14,CONTENT_Y+16,'> filter packages...',{fontFamily:mono,fontSize:'11px',color:'#1a4422',letterSpacing:1}).setOrigin(0,0.5);

    // ── Detail panel ──
    this.add.rectangle(DETAIL_X,CONTENT_Y,W-DETAIL_X,CONTENT_H,0x010a03,1).setOrigin(0,0);

    // ── Footer ──
    this.add.rectangle(W/2,H-FTR_H,W,FTR_H,0x010a03,0.98).setOrigin(0.5,0);
    this.add.rectangle(W/2,H-FTR_H,W,1,0x0a2818,1).setOrigin(0.5,0);
    this._promptTxt=this.add.text(20,H-FTR_H/2,'',{fontFamily:mono,fontSize:'11px',color:'#00ff66',letterSpacing:1}).setOrigin(0,0.5);
    this._cursorBlock=this.add.rectangle(0,H-FTR_H/2,7,13,0x00ff66,1).setOrigin(0,0.5);
    this.tweens.add({targets:this._cursorBlock,alpha:{from:1,to:0},duration:500,yoyo:true,repeat:-1,ease:'Step'});

    // Back button
    const backBg=this.add.rectangle(W-160,H-FTR_H/2,130,34,0x000000,0.9).setStrokeStyle(1,0x0a2818,1).setInteractive({useHandCursor:true});
    const backTxt=this.add.text(W-160,H-FTR_H/2,'[ ESC — BACK ]',{fontFamily:mono,fontSize:'11px',color:'#336644',letterSpacing:1}).setOrigin(0.5);
    backBg.on('pointerover',()=>{backBg.setStrokeStyle(1,0x336644,1);backTxt.setColor('#00cc66');});
    backBg.on('pointerout',()=>{backBg.setStrokeStyle(1,0x0a2818,1);backTxt.setColor('#336644');});
    backBg.on('pointerdown',()=>this._goBack());

    // Install button
    this._installBg=this.add.rectangle(W-24,H-FTR_H/2,140,34,0x000000,0.9).setStrokeStyle(1,0x0a3318,1).setOrigin(1,0.5).setInteractive({useHandCursor:false}).setAlpha(0.4);
    this._installTxt=this.add.text(W-24-70,H-FTR_H/2,'[ INSTALL ]',{fontFamily:mono,fontSize:'11px',color:'#00ff66',letterSpacing:2}).setOrigin(0.5).setAlpha(0.4);

    // ── Build package data ──
    const metaMap={};
    META_UPGRADES.forEach(u=>metaMap[u.id]=u);
    const TIERS=[
      {label:'// TIER_1 — ENTRY',ids:['start_shield','slow_combo','heat_sink','primed_signal','overclock_chip']},
      {label:'// TIER_2 — ADVANCED',ids:['redundant_buf','signal_amp','data_compress','packet_router','ghost_protocol']},
      {label:'// TIER_3 — CORE',ids:['redundant_path','kernel_access']},
    ];

    // Parent map from NODES in old tree
    const PARENTS={
      start_shield:[],slow_combo:[],heat_sink:[],primed_signal:[],overclock_chip:[],
      redundant_buf:['start_shield','slow_combo'],
      signal_amp:['slow_combo','heat_sink'],
      data_compress:['heat_sink','primed_signal'],
      packet_router:['primed_signal','overclock_chip'],
      ghost_protocol:['data_compress','packet_router'],
      redundant_path:['redundant_buf'],
      kernel_access:['signal_amp','data_compress'],
    };
    // Children (reverse)
    const CHILDREN={};
    Object.entries(PARENTS).forEach(([id,pars])=>{
      pars.forEach(p=>{if(!CHILDREN[p])CHILDREN[p]=[];CHILDREN[p].push(id);});
    });

    const buildPkgs=()=>{
      const pkgs=[];
      TIERS.forEach(tier=>{
        tier.ids.forEach(id=>{
          const meta=metaMap[id];if(!meta)return;
          const owned=Save.hasMeta(id);
          const parentOwned=(PARENTS[id]||[]).length===0||(PARENTS[id]||[]).some(p=>Save.hasMeta(p));
          const canAfford=!owned&&parentOwned&&Save.fragments()>=meta.cost;
          const available=!owned&&parentOwned;
          pkgs.push({id,meta,owned,available,canAfford,tier:tier.label,
            parents:PARENTS[id]||[],children:CHILDREN[id]||[]});
        });
      });
      return pkgs;
    };

    // ── Render package list ──
    this._listObjs=[];
    this._selected=null;
    this._pkgs=[];

    const renderList=()=>{
      this._listObjs.forEach(o=>{try{o.destroy();}catch{}});
      this._listObjs=[];
      this._pkgs=buildPkgs();
      const add2=o=>{this._listObjs.push(o);return o;};

      let ly=CONTENT_Y+40;
      let lastTier='';
      this._pkgs.forEach((pkg,idx)=>{
        if(pkg.tier!==lastTier){
          lastTier=pkg.tier;
          add2(this.add.rectangle(0,ly,SB_W,1,0x071a0f,1).setOrigin(0,0));
          add2(this.add.text(12,ly+6,pkg.tier,{fontFamily:mono,fontSize:'9px',color:'#1a4422',letterSpacing:2}));
          ly+=22;
        }
        const ROW_H=34;
        const isActive=this._selected===pkg.id;

        const rowBg=add2(this.add.rectangle(0,ly,SB_W,ROW_H,0x000000,isActive?0.9:0).setOrigin(0,0));
        if(isActive)add2(this.add.rectangle(0,ly,2,ROW_H,0x00ff66,1).setOrigin(0,0));
        if(isActive)rowBg.setFillStyle(0x071a0f,1);

        // Status dot
        const dotCol=pkg.owned?0x00ff66:pkg.available?0x00cc66:0x0a1a0a;
        const dotBg=add2(this.add.circle(22,ly+ROW_H/2,8,0x040e06));
        add2(this.add.circle(22,ly+ROW_H/2,8).setStrokeStyle(1,dotCol,pkg.owned?1:pkg.available?0.8:0.2));
        const dotTxt=add2(this.add.text(22,ly+ROW_H/2,pkg.owned?'✓':pkg.available?'◆':'✕',
          {fontFamily:mono,fontSize:'8px',color:'#'+dotCol.toString(16).padStart(6,'0')}).setOrigin(0.5));

        // Name
        const nameCol=pkg.owned?'#1a5530':pkg.available?'#00cc66':'#0d2016';
        add2(this.add.text(40,ly+ROW_H/2,pkg.meta.label,{fontFamily:mono,fontSize:'10px',letterSpacing:1,color:nameCol}).setOrigin(0,0.5));

        // Cost / status
        const costStr=pkg.owned?'INSTALLED':pkg.available?`◆ ${pkg.meta.cost}`:'LOCKED';
        const costCol=pkg.owned?'#1a4422':pkg.canAfford?'#00aa55':pkg.available?'#1a4422':'#0a1a0a';
        add2(this.add.text(SB_W-10,ly+ROW_H/2,costStr,{fontFamily:mono,fontSize:'9px',color:costCol,letterSpacing:1}).setOrigin(1,0.5));

        // Separator
        add2(this.add.rectangle(0,ly+ROW_H,SB_W,1,0x040c05,1).setOrigin(0,0));

        // Hit area
        const hit=add2(this.add.rectangle(0,ly,SB_W,ROW_H,0x000000,0).setOrigin(0,0).setInteractive({useHandCursor:true}));
        hit.on('pointerover',()=>{if(this._selected!==pkg.id)rowBg.setFillStyle(0x040e06,1);});
        hit.on('pointerout', ()=>{if(this._selected!==pkg.id)rowBg.setFillStyle(0x000000,0);});
        hit.on('pointerdown',()=>{
          this._selected=pkg.id;
          renderList();
          showDetail(pkg);
        });

        ly+=ROW_H+1;
      });
    };

    // ── Render detail ──
    this._detailObjs=[];
    const showDetail=(pkg)=>{
      this._detailObjs.forEach(o=>{try{o.destroy();}catch{}});
      this._detailObjs=[];
      const dadd=o=>{this._detailObjs.push(o);return o;};
      const DX=DETAIL_X+28, DW=W-DETAIL_X-56;
      let dy=CONTENT_Y+20;

      // Update prompt
      const cmd=pkg.owned?`status ${pkg.id}`:pkg.available?`install ${pkg.id}`:`info ${pkg.id}`;
      this._promptTxt.setText(`root@signal_lost:~/network$ ${cmd}`);
      const promptW=this._promptTxt.width;
      this._cursorBlock.setX(this._promptTxt.x+promptW+4);

      // Update install button
      if(pkg.canAfford){
        this._installBg.setAlpha(1).setStrokeStyle(1,0x0a3318,1).setInteractive({useHandCursor:true});
        this._installTxt.setAlpha(1).setText(`[ INSTALL — ◆ ${pkg.meta.cost} ]`);
        this._installBg.removeAllListeners();
        this._installBg.on('pointerover',()=>{this._installBg.setFillStyle(0x071a0f,1).setStrokeStyle(1,0x00ff66,1);this._installTxt.setColor('#ffffff');});
        this._installBg.on('pointerout', ()=>{this._installBg.setFillStyle(0x000000,0.9).setStrokeStyle(1,0x0a3318,1);this._installTxt.setColor('#00ff66');});
        this._installBg.on('pointerdown',()=>doInstall(pkg));
      } else {
        this._installBg.setAlpha(0.3).setInteractive({useHandCursor:false});
        this._installTxt.setAlpha(0.3).setText(pkg.owned?'[ INSTALLED ]':'[ LOCKED ]');
        this._installBg.removeAllListeners();
      }

      // Cmd echo
      dadd(this.add.text(DX,dy,`> ${cmd}`,{fontFamily:mono,fontSize:'11px',color:'#00ff66',letterSpacing:1}));
      dy+=18;
      dadd(this.add.text(DX,dy,'Reading package manifest...',{fontFamily:mono,fontSize:'10px',color:'#1a4422',letterSpacing:1}));
      dy+=28;

      // Name + tier
      const ac='#'+pkg.meta.col.toString(16).padStart(6,'0');
      dadd(this.add.text(DX,dy,pkg.meta.label,{fontFamily:orb,fontSize:'20px',fontStyle:'900',color:ac,letterSpacing:4}));
      dy+=26;

      // Tier badge
      const tierShort=pkg.tier.replace('// ','').replace('ENTRY','ENTRY NODE').replace('ADVANCED','ADVANCED MODULE').replace('CORE','CORE UPGRADE');
      dadd(this.add.text(DX,dy,`// ${tierShort}`,{fontFamily:mono,fontSize:'9px',color:'#1a5530',letterSpacing:3}));
      dy+=22;

      // Stat boxes
      const stats=[
        {l:'COST',  v:pkg.owned?'INSTALLED':`◆ ${pkg.meta.cost}`, c:pkg.owned?'#1a5530':pkg.canAfford?'#00ff66':'#336644'},
        {l:'STATUS',v:pkg.owned?'INSTALLED':pkg.available?'AVAILABLE':'LOCKED',c:pkg.owned?'#00ff66':pkg.available?'#00cc66':'#1a4422'},
        {l:'REQUIRES',v:pkg.parents.length?pkg.parents.map(p=>p.toUpperCase().replace('_','-')).join(', '):'NONE',c:pkg.parents.every(p=>Save.hasMeta(p))?'#00ff66':'#cc6600'},
        {l:'UNLOCKS',v:pkg.children.length?pkg.children.map(p=>p.toUpperCase().replace('_','-')).join(', '):'NONE',c:'#336644'},
      ];
      const SBW=Math.floor((DW)/4)-6;
      stats.forEach((s,i)=>{
        const sx=DX+i*(SBW+6);
        dadd(this.add.rectangle(sx,dy,SBW,50,0x040e06,1).setOrigin(0,0).setStrokeStyle(1,0x071a0f,1));
        dadd(this.add.text(sx+10,dy+10,s.l,{fontFamily:mono,fontSize:'8px',color:'#1a4422',letterSpacing:2}));
        dadd(this.add.text(sx+10,dy+28,s.v,{fontFamily:mono,fontSize:'10px',color:s.c,letterSpacing:1,wordWrap:{width:SBW-20}}));
      });
      dy+=62;

      // Divider
      dadd(this.add.rectangle(DX,dy,DW,1,0x0a2818,1).setOrigin(0,0));
      dy+=14;

      // Description
      dadd(this.add.text(DX,dy,'DESCRIPTION',{fontFamily:mono,fontSize:'9px',color:'#1a4422',letterSpacing:3}));
      dy+=14;
      dadd(this.add.text(DX,dy,pkg.meta.desc,{fontFamily:mono,fontSize:'11px',color:'#2a6640',wordWrap:{width:DW},lineSpacing:4}));
      dy+=36;

      // Synergy section — only if meaningful
      const SYNERGIES={
        redundant_buf:'CORE skin: +1 hits stacks on 3-hit passive = 4 hits at run start. FORTRESS archetype: combined with shield:1 seed.',
        signal_amp:'REFLECTOR archetype: chain kill damage ×1.5 per hit. STORM passive: bonus bullet also gets amp.',
        heat_sink:'OVERCLOCKER archetype: safe high-heat playstyle without overheat risk.',
        overclock_chip:'OVERCLOCKER archetype: seeds overclock_burst:1 already — combined = T2 from wave 1.',
        ghost_protocol:'GHOST archetype: seeds ghost_trace:2 already — combined = T3 from wave 1.',
        kernel_access:'Every UpgradeScene pass offers 4 cards instead of 3. Compounds with REFLECTOR (more choices = better chains).',
        primed_signal:'STORM archetype: surge-ready on wave 1 for immediate EMP burst.',
        redundant_path:'FORTRESS archetype: extra life on top of high shield = near-unkillable early game.',
        slow_combo:'STORM passive (every 5th reflect = bonus bullet): longer window = more combos.',
        packet_router:'Any run using PING as active power benefits directly.',
        data_compress:'Universal — 25% more shards per run compounds over time.',
        start_shield:'Stacks with redundant_buf and CORE skin. Pairs with null_zone upgrade.',
      };
      const syn=SYNERGIES[pkg.id];
      if(syn){
        dadd(this.add.text(DX,dy,'SYNERGY',{fontFamily:mono,fontSize:'9px',color:'#1a4422',letterSpacing:3}));
        dy+=14;
        dadd(this.add.text(DX,dy,syn,{fontFamily:mono,fontSize:'11px',color:'#336644',wordWrap:{width:DW},lineSpacing:4}));
        dy+=36;
      }

      // Status message if owned
      if(pkg.owned){
        dadd(this.add.rectangle(DX,dy,DW,1,0x0a2818,1).setOrigin(0,0));dy+=14;
        dadd(this.add.text(DX,dy,'[OK] Package already installed. Effect active in all future runs.',{fontFamily:mono,fontSize:'11px',color:'#1a5530',letterSpacing:1}));
      } else if(!pkg.available){
        dadd(this.add.rectangle(DX,dy,DW,1,0x0a2818,1).setOrigin(0,0));dy+=14;
        dadd(this.add.text(DX,dy,'[LOCKED] Install required parent packages first.',{fontFamily:mono,fontSize:'11px',color:'#3a1a00',letterSpacing:1}));
        const missing=pkg.parents.filter(p=>!Save.hasMeta(p));
        dadd(this.add.text(DX,dy+18,`missing: ${missing.join(', ')}`,{fontFamily:mono,fontSize:'10px',color:'#2a1000',letterSpacing:1}));
      } else if(!pkg.canAfford){
        dadd(this.add.rectangle(DX,dy,DW,1,0x0a2818,1).setOrigin(0,0));dy+=14;
        dadd(this.add.text(DX,dy,`[WARN] Insufficient fragments. Need ◆ ${pkg.meta.cost}, have ◆ ${Save.fragments()}.`,{fontFamily:mono,fontSize:'11px',color:'#3a2a00',letterSpacing:1}));
      }
    };

    const doInstall=(pkg)=>{
      if(!Save.spendFragments(pkg.meta.cost))return;
      Snd.init();Snd.play('install');
      Save.setMeta(pkg.id,true);
      if(Settings.get('shake'))this.cameras.main.flash(180,(pkg.meta.col>>16)&0xff,(pkg.meta.col>>8)&0xff,pkg.meta.col&0xff,0.15);
      // Flash install line in detail
      this._detailObjs.forEach(o=>{try{o.destroy();}catch{}});
      this._detailObjs=[];
      const dc=this.add.text(DETAIL_X+28,CONTENT_Y+20,`> install ${pkg.id}`,{fontFamily:mono,fontSize:'11px',color:'#00ff66'});
      this._detailObjs.push(dc);
      const dc2=this.add.text(DETAIL_X+28,CONTENT_Y+40,'[OK] Package installed successfully.',{fontFamily:mono,fontSize:'12px',color:'#00ff88',letterSpacing:1});
      this._detailObjs.push(dc2);
      const dc3=this.add.text(DETAIL_X+28,CONTENT_Y+60,`Effect active from next run.`,{fontFamily:mono,fontSize:'11px',color:'#336644'});
      this._detailObjs.push(dc3);
      // Rebuild list
      this._fragTxt.setText(`◆ ${Save.fragments()} FRAGMENTS`);
      this.time.delayedCall(600,()=>{
        renderList();
        const newPkg=buildPkgs().find(p=>p.id===pkg.id);
        if(newPkg)showDetail(newPkg);
      });
    };

    // ── Keyboard ──
    const goBack=()=>this._goBack();
    this.input.keyboard&&this.input.keyboard.on('keydown-ESC',goBack);

    // Arrow key nav
    this.input.keyboard&&this.input.keyboard.on('keydown-DOWN',()=>{
      const pkgs=buildPkgs();
      const idx=pkgs.findIndex(p=>p.id===this._selected);
      const next=pkgs[Math.min(idx+1,pkgs.length-1)];
      if(next){this._selected=next.id;renderList();showDetail(next);}
    });
    this.input.keyboard&&this.input.keyboard.on('keydown-UP',()=>{
      const pkgs=buildPkgs();
      const idx=pkgs.findIndex(p=>p.id===this._selected);
      const prev=pkgs[Math.max(idx-1,0)];
      if(prev){this._selected=prev.id;renderList();showDetail(prev);}
    });
    this.input.keyboard&&this.input.keyboard.on('keydown-ENTER',()=>{
      const pkg=buildPkgs().find(p=>p.id===this._selected);
      if(pkg&&pkg.canAfford)doInstall(pkg);
    });

    // ── Init ──
    this._fragTxt.setText(`◆ ${Save.fragments()} FRAGMENTS`);
    this._promptTxt.setText('root@signal_lost:~/network$ _');
    this._cursorBlock.setX(this._promptTxt.x+this._promptTxt.width+4);
    renderList();

    // Auto-select first available
    const firstAvail=buildPkgs().find(p=>p.available&&!p.owned)||buildPkgs()[0];
    if(firstAvail){this._selected=firstAvail.id;renderList();showDetail(firstAvail);}
  }

  _goBack(){
    this.cameras.main.fadeOut(220,0,0,0);
    this.time.delayedCall(220,()=>{
      this.scene.stop('MetaUpgradeScene');
      const ms=this.scene.get('MenuScene');
      if(ms&&ms.sys.isSleeping())this.scene.wake('MenuScene');
      else this.scene.start('MenuScene');
    });
  }
}

class CorruptedBriefingScene extends Phaser.Scene{

    this._data=d||{};
    this.cameras.main.setBackgroundColor('#020804');

    const MODIFIERS=[

    this.add.rectangle(W/2,0,W,44,0x000000,0.97).setOrigin(0.5,0);
    this.add.rectangle(W/2,44,W,2,0xcc44ff,0.7).setOrigin(0.5,0);
    this.add.text(W/2,21,'CORRUPTED_MODE — ACTIVE_MODIFIERS',{fontFamily:"'Orbitron',sans-serif",fontSize:'18px',fontStyle:'900',color:'#cc44ff',letterSpacing:4}).setOrigin(0.5);
    this.add.text(W/2,54,'One of these modifiers activates every wave — chosen at random',{fontFamily:"'Courier New',monospace",fontSize:'12px',color:'#774488',letterSpacing:1}).setOrigin(0.5);
    const COLS=3,CW=360,CH=76,GAPX=20,GAPY=10;
    const totalW=COLS*CW+(COLS-1)*GAPX;
    const sx=(W-totalW)/2;
    const sy=70;
    MODIFIERS.forEach((m,i)=>{
      const col=i%COLS,row=Math.floor(i/COLS);
      const cx=sx+col*(CW+GAPX)+CW/2,cy=sy+row*(CH+GAPY)+CH/2;
      const ac=m.col,acS='#'+ac.toString(16).padStart(6,'0');
      this.add.rectangle(cx,cy,CW,CH,0x030006,0.97).setStrokeStyle(1,ac,0.55);
      this.add.rectangle(cx-CW/2,cy,3,CH,ac,0.85).setOrigin(0,0.5);
      this.add.text(cx-CW/2+12,cy-CH/2+10,m.id,{fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#553366'});
      this.add.text(cx-CW/2+12,cy-CH/2+26,m.label,{fontFamily:"'Orbitron',sans-serif",fontSize:'14px',fontStyle:'900',color:acS});
      this.add.text(cx-CW/2+12,cy-CH/2+48,m.desc,{fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#667788',wordWrap:{width:CW-24}});
    });
    const contFn=()=>{
      this.cameras.main.fadeOut(280,0,0,0);
      this.time.delayedCall(280,()=>{this.scene.stop('CorruptedBriefingScene');this.scene.start('BootScene',this._data);});
    };
    this.input.keyboard&&this.input.keyboard.on('keydown-ENTER',contFn);
    this.input.keyboard&&this.input.keyboard.on('keydown-SPACE',contFn);
    const contBg=this.add.rectangle(W/2,H-28,320,34,0x000000,0.9).setStrokeStyle(2,0xcc44ff,0.8).setInteractive({useHandCursor:true});
    const contTxt=this.add.text(W/2,H-28,'[ ACKNOWLEDGED — BEGIN CORRUPTED RUN ]',{fontFamily:"'Courier New',monospace",fontSize:'13px',fontStyle:'bold',color:'#cc44ff'}).setOrigin(0.5);
    this.tweens.add({targets:contTxt,alpha:0.4,duration:600,yoyo:true,repeat:-1,delay:400});
    contBg.on('pointerover',()=>{contBg.setFillStyle(0xcc44ff,0.12);contTxt.setAlpha(1);});
    contBg.on('pointerout', ()=>{contBg.setFillStyle(0x000000,0.9);});
    contBg.on('pointerdown',contFn);
  }
}

class BootScene extends Phaser.Scene{
  constructor(){super('BootScene');}

  create(data){
    CRT.suppress=true;
    try{
      this.cameras.main.setBackgroundColor('#020804');
      this.cameras.main.fadeIn(280,0,0,0);
      this._data=data||{};
      this.t=0;
      const mode=data.mode||'normal';
      const diff=(Settings.get('difficulty')||'daemon').toUpperCase();
      const archId=data.archetype||'reflector';
      const arch=ARCHETYPES.find(a=>a.id===archId)||ARCHETYPES[0];
      const acN=arch.col;
      const acS='#'+acN.toString(16).padStart(6,'0');

      // Mode accent colour


      // Duration — how long before launching GameScene
      const DURATION={normal:2600,daily:2400,corrupted:2000,endless:2800};
      const dur=DURATION[mode]||2600;

      // ── Background hex grid ──
      const hg=this.add.graphics().setAlpha(0.07);
      hg.lineStyle(1,acN,1);
      for(let hx=0;hx<W+80;hx+=80){
        for(let hy=0;hy<H+80;hy+=70){
          const ox=Math.floor(hy/70)%2===0?0:40;
          hg.beginPath();
          for(let s=0;s<6;s++){const a=(Math.PI/3)*s;if(s===0)hg.moveTo(hx+ox+Math.cos(a)*36,hy+Math.sin(a)*36);else hg.lineTo(hx+ox+Math.cos(a)*36,hy+Math.sin(a)*36);}
          hg.closePath();hg.strokePath();
        }
      }

      // ── Corner brackets ──
      const cg=this.add.graphics();
      [[0,0],[W,0],[0,H],[W,H]].forEach(([cx2,cy2])=>{
        const sx=cx2===0?1:-1,sy=cy2===0?1:-1;
        cg.lineStyle(2,acN,0.5);
        cg.beginPath();cg.moveTo(cx2+sx*28,cy2);cg.lineTo(cx2,cy2);cg.lineTo(cx2,cy2+sy*28);cg.strokePath();
      });

      // ── Top strip ──
      this.add.rectangle(W/2,0,W,32,0x000000,0.95).setOrigin(0.5,0);
      this.add.rectangle(W/2,32,W,1,acN,0.6).setOrigin(0.5,0);
      const modeLabel={normal:'INITIALIZE',daily:'DAILY_CHALLENGE',corrupted:'CORRUPTED_MODE',endless:'ENDLESS_MODE'};
      this.add.text(W/2,15,`${modeLabel[mode]||'INITIALIZE'}.SH — PROCESS INITIALISING`,{fontFamily:"'Courier New',monospace",fontSize:'12px',fontStyle:'bold',color:acS,letterSpacing:2}).setOrigin(0.5,0.5);
      this.add.text(16,15,`[${mode.toUpperCase()}]`,{fontFamily:"'Courier New',monospace",fontSize:'10px',color:acS}).setOrigin(0,0.5);
      this.add.text(W-16,15,`${diff} DIFFICULTY`,{fontFamily:"'Courier New',monospace",fontSize:'10px',color:acS}).setOrigin(1,0.5);

      // ── CENTER: Archetype spotlight ──
      const CX=W/2, CY=H/2-30;

      // Animated hex rings — drawn in update
      this._hexGfx=this.add.graphics().setDepth(5);
      this._hexRings=[
        {r:58, speed:0.8,  alpha:0.55, width:1.5},
        {r:80, speed:-0.5, alpha:0.30, width:1.0},
        {r:104,speed:0.3,  alpha:0.15, width:0.8},
        {r:130,speed:-0.2, alpha:0.08, width:0.5},
      ];
      this._hexCX=CX;
      this._hexCY=CY;
      this._hexCol=acN;

      // Inner hex fill glow
      const innerGfx=this.add.graphics().setDepth(4);
      innerGfx.fillStyle(acN,0.10);
      for(let s=0;s<6;s++){const a=(Math.PI/3)*s;if(s===0)innerGfx.moveTo(CX+Math.cos(a)*48,CY+Math.sin(a)*48);else innerGfx.lineTo(CX+Math.cos(a)*48,CY+Math.sin(a)*48);}
      innerGfx.closePath();innerGfx.fillPath();
      innerGfx.lineStyle(2,acN,0.7);
      innerGfx.beginPath();
      for(let s=0;s<6;s++){const a=(Math.PI/3)*s;if(s===0)innerGfx.moveTo(CX+Math.cos(a)*48,CY+Math.sin(a)*48);else innerGfx.lineTo(CX+Math.cos(a)*48,CY+Math.sin(a)*48);}
      innerGfx.closePath();innerGfx.strokePath();

      // Icon inside hex
      this.add.text(CX,CY,arch.icon,{fontFamily:"'Courier New',monospace",fontSize:'44px',color:acS}).setOrigin(0.5).setDepth(6);

      // Archetype name
      const nameT=this.add.text(CX,CY+72,arch.name,{
        fontFamily:"'Orbitron',sans-serif",fontSize:'32px',fontStyle:'900',color:acS,letterSpacing:4
      }).setOrigin(0.5).setAlpha(0).setDepth(6);
      this.tweens.add({targets:nameT,alpha:1,duration:300,delay:200});

      // Tagline
      const tagT=this.add.text(CX,CY+110,arch.tagline,{
        fontFamily:"'Courier New',monospace",fontSize:'12px',color:acS,letterSpacing:1
      }).setOrigin(0.5).setAlpha(0).setDepth(6);
      this.tweens.add({targets:tagT,alpha:1,duration:300,delay:400});

      // Divider
      const divGfx=this.add.graphics().setDepth(6).setAlpha(0);
      divGfx.lineStyle(1,acN,0.3);
      divGfx.beginPath();divGfx.moveTo(CX-200,CY+128);divGfx.lineTo(CX+200,CY+128);divGfx.strokePath();
      this.tweens.add({targets:divGfx,alpha:1,duration:300,delay:500});

      // Passive text
      const passT=this.add.text(CX,CY+146,`PASSIVE: ${arch.passive}`,{
        fontFamily:"'Courier New',monospace",fontSize:'11px',color:acS,wordWrap:{width:420},align:'center'
      }).setOrigin(0.5).setAlpha(0).setDepth(6);
      this.tweens.add({targets:passT,alpha:1,duration:300,delay:600});

      // Mutations line
      const muts=this._data._runMutations||[];
      if(muts.length>0){
        const mutStr='MUTATIONS: '+muts.map(m=>m.label||m.id).join(' + ');
        const mutT=this.add.text(CX,CY+170,mutStr,{
          fontFamily:"'Courier New',monospace",fontSize:'10px',color:'#aa44ff'
        }).setOrigin(0.5).setAlpha(0).setDepth(6);
        this.tweens.add({targets:mutT,alpha:1,duration:300,delay:800});
      }

      // ── Bottom: progress bar + status lines ──
      const barY=H-48;
      this.add.rectangle(120,barY,W-240,4,0x001100,1).setOrigin(0,0.5);
      const barFill=this.add.rectangle(120,barY,0,4,acN,0.9).setOrigin(0,0.5);
      this.tweens.add({targets:barFill,width:W-240,duration:dur-400,ease:'Sine.Out'});

      // Status text below bar
      const statusLines=[
        `INITIALISING WAVE_001 — ${(this._data.archetypeSeeds?Object.entries(this._data.archetypeSeeds).map(([k,v])=>k.toUpperCase()+' T'+v).join(' · '):'NO SEEDS')}`,
        `SECTOR: SURFACE_LAYER  ·  DIFF: ${diff}  ·  MODE: ${mode.toUpperCase()}`,
      ];
      const stTxt=this.add.text(W/2,barY+12,statusLines[0],{
        fontFamily:"'Courier New',monospace",fontSize:'10px',color:acS
      }).setOrigin(0.5).setAlpha(0);
      this.tweens.add({targets:stTxt,alpha:1,duration:200,delay:300});
      this.time.delayedCall(dur*0.5,()=>{try{stTxt.setText(statusLines[1]);}catch{}});

      // Scan sweep
      const sweep=this.add.rectangle(0,32,W,2,acN,0.18).setOrigin(0,0);
      this.tweens.add({targets:sweep,y:H,duration:dur*0.65,ease:'Linear'});

      // ── Launch ──
      this.time.delayedCall(dur,()=>{
        const flash=this.add.rectangle(W/2,H/2,W,H,acN,0).setDepth(50);
        this.tweens.add({targets:flash,alpha:0.2,duration:100,yoyo:true,onComplete:()=>{
          this.cameras.main.fadeOut(300,0,0,0);
          this.time.delayedCall(300,()=>this.scene.start('GameScene',data));
        }});
      });

    }catch(err){
      console.error('[BOOT SCENE ERROR]',err);
      this.scene.start('GameScene',this._data||{});
    }
  }

  update(_,delta){
    this.t+=delta/1000;
    if(!this._hexGfx||!this._hexRings)return;
    this._hexGfx.clear();
    this._hexRings.forEach((ring,i)=>{
      const angle=this.t*ring.speed+(i*Math.PI/3);
      this._hexGfx.lineStyle(ring.width,this._hexCol,ring.alpha);
      this._hexGfx.beginPath();
      for(let s=0;s<6;s++){
        const a=angle+(Math.PI/3)*s;
        if(s===0)this._hexGfx.moveTo(this._hexCX+Math.cos(a)*ring.r,this._hexCY+Math.sin(a)*ring.r);
        else this._hexGfx.lineTo(this._hexCX+Math.cos(a)*ring.r,this._hexCY+Math.sin(a)*ring.r);
      }
      this._hexGfx.closePath();this._hexGfx.strokePath();
    });
  }
}

class OverclockScene extends Phaser.Scene{
  constructor(){super('OverclockScene');}
  create(data){
    const W=1280,H=720;
    const mono="'Courier New',monospace", orb="'Orbitron',sans-serif";

    // Only show every 3 waves
    if(data.wave%3!==0){
      this.scene.stop();
      this.scene.launch('UpgradeScene',{...data,extraCard:Save.hasMeta('kernel_access')});
      return;
    }

    this.cameras.main.setBackgroundColor('#000000');
    this.cameras.main.fadeIn(400,0,0,0);

    // ── Pulsing full-screen bg glow ──
    const glow=this.add.graphics();
    const drawGlow=(a)=>{
      glow.clear();
      glow.fillStyle(0x00ff44,a);
      glow.fillRect(0,0,W,H);
    };
    drawGlow(0);
    this.tweens.add({targets:{v:0},v:0.06,duration:800,yoyo:true,repeat:-1,
      onUpdate:(tw,obj)=>drawGlow(obj.v)});

    // Grid lines
    const g=this.add.graphics();
    g.lineStyle(1,0x001a0a,0.4);
    for(let x=0;x<=W;x+=80){g.moveTo(x,0);g.lineTo(x,H);}
    for(let y=0;y<=H;y+=80){g.moveTo(0,y);g.lineTo(W,y);}
    g.strokePath();

    // ── Top accent line ──
    this.add.rectangle(W/2,0,W,3,0x00ff44,0.9).setOrigin(0.5,0);
    this.add.rectangle(W/2,H,W,3,0x00ff44,0.9).setOrigin(0.5,1);

    // ── Warning tag ──
    this.add.text(W/2,54,'// SECTOR_OVERCLOCK.SH — DECISION REQUIRED',{
      fontFamily:mono,fontSize:'10px',color:'#224433',letterSpacing:3
    }).setOrigin(0.5);

    // ── Main headline — big and dramatic ──
    const hdr=this.add.text(W/2,H/2-120,'OVERCLOCK\nTHIS SECTOR?',{
      fontFamily:orb,fontSize:'64px',fontStyle:'900',
      color:'#00ff44',letterSpacing:8,align:'center',lineSpacing:10
    }).setOrigin(0.5).setAlpha(0);
    this.tweens.add({targets:hdr,alpha:1,duration:500,ease:'Power2'});

    // ── Divider ──
    this.add.rectangle(W/2,H/2+12,600,1,0x00ff44,0.25).setOrigin(0.5);

    // ── Risk/reward stats row ──
    const statY=H/2+40;
    const statData=[
      {label:'ENEMY SPEED',val:'+60%',  col:'#ff4444'},
      {label:'SPAWN RATE', val:'×2',    col:'#ff8800'},
      {label:'SCORE MULT', val:'×3',    col:'#00ff44'},
    ];
    statData.forEach((s,i)=>{
      const sx=W/2-240+i*240;
      this.add.rectangle(sx,statY+18,200,52,parseInt(s.col.replace('#',''),16),0.08).setOrigin(0.5);
      this.add.rectangle(sx-100,statY,2,52,parseInt(s.col.replace('#',''),16),0.6).setOrigin(0,0.5);
      this.add.text(sx,statY+6,s.label,{fontFamily:mono,fontSize:'9px',color:'#445544',letterSpacing:2}).setOrigin(0.5);
      this.add.text(sx,statY+26,s.val,{fontFamily:mono,fontSize:'22px',fontStyle:'bold',color:s.col}).setOrigin(0.5);
    });

    // ── Bottom command strip ──
    const STRIP_Y=H-80;
    this.add.rectangle(W/2,STRIP_Y,W,80,0x000000,0.97).setOrigin(0.5,0);
    this.add.rectangle(W/2,STRIP_Y,W,1.5,0x1a3322,1).setOrigin(0.5,0);

    // OVERCLOCK button — full left half
    const ocBg=this.add.rectangle(W/4,STRIP_Y+40,W/2-2,78,0x00ff44,0.10).setOrigin(0.5,0.5).setInteractive({useHandCursor:true});
    this.add.rectangle(0,STRIP_Y,3,80,0x00ff44,0.8).setOrigin(0,0);
    const ocLabel=this.add.text(W/4,STRIP_Y+22,'[ OVERCLOCK ]',{fontFamily:mono,fontSize:'16px',fontStyle:'bold',color:'#00ff44'}).setOrigin(0.5);
    this.add.text(W/4,STRIP_Y+46,'SCORE ×3  ·  HIGH RISK  ·  ENEMIES +60%',{fontFamily:mono,fontSize:'10px',color:'#336644'}).setOrigin(0.5);
    this.add.rectangle(W/2-1,STRIP_Y,1,80,0x1a3322,0.8).setOrigin(0.5,0);
    ocBg.on('pointerover',()=>{ocBg.setFillStyle(0x00ff44,0.18);ocLabel.setColor('#ffffff');});
    ocBg.on('pointerout', ()=>{ocBg.setFillStyle(0x00ff44,0.10);ocLabel.setColor('#00ff44');});
    ocBg.on('pointerdown',()=>{
      this.cameras.main.flash(120,0,255,80,true);
      this.cameras.main.fadeOut(280,0,0,0);
      this.time.delayedCall(280,()=>{
        this.scene.stop();
        this.scene.launch('UpgradeScene',{...data,overclocked:true,extraCard:Save.hasMeta('kernel_access')});
      });
    });

    // PROCEED button — full right half
    const skBg=this.add.rectangle(W*3/4,STRIP_Y+40,W/2-2,78,0xff4444,0.06).setOrigin(0.5,0.5).setInteractive({useHandCursor:true});
    this.add.rectangle(W-3,STRIP_Y,3,80,0xff4444,0.4).setOrigin(0,0);
    const skLabel=this.add.text(W*3/4,STRIP_Y+22,'[ PROCEED ]',{fontFamily:mono,fontSize:'16px',fontStyle:'bold',color:'#446633'}).setOrigin(0.5);
    this.add.text(W*3/4,STRIP_Y+46,'STANDARD  ·  SAFE  ·  NO BONUS',{fontFamily:mono,fontSize:'10px',color:'#336644'}).setOrigin(0.5);
    skBg.on('pointerover',()=>{skBg.setFillStyle(0xff4444,0.12);skLabel.setColor('#ff8888');});
    skBg.on('pointerout', ()=>{skBg.setFillStyle(0xff4444,0.06);skLabel.setColor('#446633');});
    skBg.on('pointerdown',()=>{
      this.cameras.main.fadeOut(280,0,0,0);
      this.time.delayedCall(280,()=>{
        this.scene.stop();
        this.scene.launch('UpgradeScene',{...data,overclocked:false,extraCard:Save.hasMeta('kernel_access')});
      });
    });

    // ── Countdown ──
    let t=8;
    const cT=this.add.text(W/2,STRIP_Y-14,`AUTO-PROCEED IN ${t}s`,{
      fontFamily:mono,fontSize:'10px',color:'#224433'
    }).setOrigin(0.5,1);
    this.time.addEvent({delay:1000,repeat:7,callback:()=>{
      t--;
      cT.setText(t>0?`AUTO-PROCEED IN ${t}s`:'PROCEEDING...');
      if(t<=0){
        this.cameras.main.fadeOut(280,0,0,0);
        this.time.delayedCall(280,()=>{
          this.scene.stop();
          this.scene.launch('UpgradeScene',{...data,overclocked:false,extraCard:Save.hasMeta('kernel_access')});
        });
      }
    }});
  }
}
